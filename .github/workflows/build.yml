# Builds SmedCover installers for macOS, Windows and Linux on GitHub's machines.
#
#   - Run it by hand:  GitHub → Actions → "Build SmedCover" → Run workflow.
#     The installers appear as downloadable artifacts on that run's page, and the command line alone
#     (smedcover-cli-<platform>: smedcover in a .tar.gz, smedcover.exe on Windows) beside them.
#   - Push a version tag (git tag v0.1.0 && git push origin v0.1.0):
#     same build, and the installers are also attached to a draft GitHub Release.
name: Build SmedCover

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write # needed to create the draft release on tag builds

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one platform failing should not cancel the others
      matrix:
        include:
          # Two separate macOS builds, each half the size of one universal app. Both are built on
          # an Apple-silicon runner; the Intel one is cross-compiled.
          - name: macOS (Apple silicon)
            os: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
            artifact: macos-apple-silicon
          - name: macOS (Intel)
            os: macos-latest
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
            artifact: macos-intel
          - name: Windows
            os: windows-latest
            args: ""
            rust-targets: ""
            artifact: windows
          - name: Linux
            os: ubuntu-22.04
            args: ""
            rust-targets: ""
            artifact: linux

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # The Cargo workspace is the repository's root, its target/ folder there (the action's default).
      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      # The repository variable SKIP_TESTS set to true (gh variable set SKIP_TESTS --body true) builds without the
      # tests, for a release cut without them; delete it after (gh variable delete SKIP_TESTS).
      - name: Run front-end tests
        if: vars.SKIP_TESTS != 'true'
        run: npm test

      - name: Run Rust tests
        if: vars.SKIP_TESTS != 'true'
        run: cargo test --workspace --locked

      # beforeBuildCommand builds the command line, smedcover, for the job's target first (scripts/sidecar.mjs: with
      # --target x86_64-apple-darwin on the Intel job, cross-compiled), and the installers carry it beside the app.
      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          # Only tag builds publish a release; manual runs just build.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: SmedCover ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: smedcover-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/macos/*.app.tar.gz
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/deb/*.deb
            target/**/release/bundle/rpm/*.rpm
            target/**/release/bundle/appimage/*.AppImage

      # The command line in the app's bundle (macOS) and in the .deb's /usr/bin (Linux).
      - name: Check the installers carry the command line
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            find target -path '*/release/bundle/macos/SmedCover.app/Contents/MacOS/smedcover' | grep .
          else
            dpkg-deb -c target/release/bundle/deb/*.deb | grep -E '(^|[ /])usr/bin/smedcover$'
          fi

      # And in the NSIS installer, listed by 7-Zip (on the Windows runner; the command line's first build, tagged 0.4.0 and never released, listed smedcover.exe there).
      - name: Check the Windows installer carries the command line
        if: runner.os == 'Windows'
        shell: bash
        run: 7z l target/release/bundle/nsis/*.exe | grep -iE '(^|[\\/ ])smedcover\.exe$'

      # The command line alone, for servers and scripts: the one the installers carry, as scripts/sidecar.mjs built it.
      # In a .tar.gz on macOS and Linux, which keeps it executable (an artifact's zip does not); the .exe on Windows.
      - name: Pack the command line
        shell: bash
        run: |
          mkdir cli-dist
          for f in src-tauri/binaries/smedcover-*; do
            case "$f" in
              *.exe) cp "$f" cli-dist/smedcover.exe ;;
              *) cp "$f" cli-dist/smedcover && tar -C cli-dist -czf cli-dist/smedcover-${{ matrix.artifact }}.tar.gz smedcover && rm cli-dist/smedcover ;;
            esac
          done
          ls -l cli-dist

      - name: Upload the command line
        uses: actions/upload-artifact@v4
        with:
          name: smedcover-cli-${{ matrix.artifact }}
          if-no-files-found: error
          path: cli-dist/*
