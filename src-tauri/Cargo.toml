[package]
name = "smedcover"
version = "0.1.0"
description = "Branded cover-image generator for video creators"
license = "AGPL-3.0-or-later"
authors = ["cybertheye"]
edition = "2021"

[lib]
name = "smedcover_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
fontdb = "0.23"
ureq = { version = "2", features = ["socks-proxy"] }
ttf-parser = "0.25"
base64 = "0.22"

# Dependencies are optimised even in development builds: the image codecs are far too slow otherwise.
[profile.dev.package."*"]
opt-level = 3
