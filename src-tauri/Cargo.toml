[package]
name = "smedcover"
version.workspace = true
description = "Branded cover-image generator for video creators"
license.workspace = true
authors.workspace = true
edition.workspace = true

[lib]
name = "smedcover_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The app's executable is `smedcover-app` (tauri.conf.json's mainBinaryName says so too): `smedcover` is the command
# line's (../cli), which starts this one when it needs the app and none is running.
[[bin]]
name = "smedcover-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# build.rs hands tauri-build the configuration without bundle.externalBin (see there).
serde_json = { workspace = true }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# What the app does for its window, Tauri aside (see ../core).
smedcover-core = { path = "../core" }
base64 = { workspace = true }
# The agents' endpoint (see mcp.rs): its status as JSON, the runtime it waits on, and the self-test's client of it.
serde_json = { workspace = true }
tokio = { workspace = true }
ureq = { workspace = true }

[dev-dependencies]
# mcp.rs's tests: a data folder of their own, and the calls they hand the endpoint's gate.
tempfile = { workspace = true }
tokio-util = { workspace = true }

# The window keeps drawing when it cannot be seen (a self-test, the agents' endpoint running): a setting of the web
# view reached through the Objective-C runtime; and an activity held while an agent's call is under way, against App
# Nap (see mcp.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
