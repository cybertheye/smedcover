[package]
name = "smedcover"
version.workspace = true
description = "Branded cover-image generator for video creators"
license.workspace = true
authors.workspace = true
edition.workspace = true

[lib]
name = "smedcover_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# What the app does for its window, Tauri aside (see ../core).
smedcover-core = { path = "../core" }
base64 = { workspace = true }

# A self-test's window keeps drawing when it cannot be seen: a setting of the web view reached through the
# Objective-C runtime (see `run` in lib.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
