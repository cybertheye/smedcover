<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmedCover</title>
<style>
  /* Bundled open fonts (SIL OFL, see fonts/OFL-*.txt) so covers look the same on every platform. */
  @font-face{font-family:"Noto Sans SC";src:url("fonts/NotoSansSC.ttf");font-weight:100 900;font-display:block}
  @font-face{font-family:"Bebas Neue";src:url("fonts/BebasNeue-Regular.ttf");font-weight:100 900;font-display:block}
  @font-face{font-family:"JetBrains Mono";src:url("fonts/JetBrainsMono.ttf");font-weight:100 800;font-display:block}

  :root{--bg:#0a0a12;--panel:#14141f;--line:#2a2a3c;--line2:#44445a;--ink:#07070c;--acc:#fcee0a;
        --ui:"Noto Sans SC",-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:#fff;font-family:var(--ui);font-size:14px;overflow:hidden}
  button,input,select,textarea{font:inherit;color:inherit}
  .app{display:grid;grid-template-rows:auto 1fr;height:100vh}

  /* top bar */
  header{display:flex;align-items:center;gap:16px;padding:9px 18px;border-bottom:2px solid var(--line);flex-wrap:wrap}
  header h1{font:400 28px "Bebas Neue",sans-serif;letter-spacing:.08em;margin:0 4px 0 0}
  .grp{display:flex;align-items:center;gap:6px}
  .grp>span{font:600 11px var(--mono);letter-spacing:.12em;opacity:.55;text-transform:uppercase;margin-right:2px;white-space:nowrap}
  .spacer{flex:1}
  .btn{border:2px solid var(--line2);background:transparent;padding:6px 11px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap}
  .btn:hover:not(:disabled){border-color:#fff}
  .btn:disabled{opacity:.3;cursor:default}
  .btn.on{background:#fff;color:var(--ink);border-color:#fff}
  .btn.solid{background:#fff;color:var(--ink);border-color:#fff;box-shadow:4px 4px 0 var(--acc)}
  .btn.wide{width:100%;padding:11px}
  .btn.cta{padding:8px 22px;font-size:15px;letter-spacing:.04em}
  .seg{display:flex}
  .seg .btn+.btn{border-left:0}
  .seg.big .btn{padding:8px 20px;font-size:15px}
  header select{background:var(--panel);border:2px solid var(--line);padding:6px 8px;max-width:180px}

  /* body: tools | canvas | layers. Side columns scroll on their own; the canvas always stays in view. */
  .body{display:grid;grid-template-columns:var(--lw,372px) minmax(0,1fr) var(--rw,320px);min-height:0}
  .body.setup{grid-template-columns:var(--sw,420px) minmax(0,1fr)}
  /* the side columns are as wide as their edge is dragged (see columns() in app.js) */
  aside{position:relative}
  .split{position:absolute;top:0;bottom:0;width:9px;cursor:col-resize;z-index:5;touch-action:none}
  #left .split{right:-6px}
  #right .split{left:-6px}
  .split:hover,.split.on{background:linear-gradient(90deg,transparent 3px,var(--acc) 3px,var(--acc) 5px,transparent 5px)}
  .body.setup #right{display:none}
  aside{display:flex;flex-direction:column;min-height:0}
  #left{border-right:2px solid var(--line)}
  #right{border-left:2px solid var(--line)}
  .tabs{display:flex}
  .tabs button{flex:1;border:0;border-bottom:3px solid transparent;background:transparent;padding:12px 4px;cursor:pointer;font-weight:600;opacity:.55}
  .tabs button.on{opacity:1;border-bottom-color:var(--acc)}
  .scroll{overflow-y:auto;min-height:0;padding:16px 14px 40px;display:flex;flex-direction:column;gap:16px;scrollbar-gutter:stable}
  .scroll>*{flex:none}
  .scroll::-webkit-scrollbar{width:10px}
  .scroll::-webkit-scrollbar-track{background:var(--panel)}
  .scroll::-webkit-scrollbar-thumb{background:#55556e;border:2px solid var(--panel)}

  label.cap,.cap{display:block;font:600 11px var(--mono);letter-spacing:.12em;opacity:.6;margin-bottom:8px;text-transform:uppercase}
  input[type=text],input[type=password],input[type=number],textarea,select{width:100%;background:var(--panel);border:2px solid var(--line);padding:9px;border-radius:0}
  textarea{height:100px;resize:vertical;font-size:16px}
  input:focus,textarea:focus,select:focus{outline:none;border-color:#fff}
  .hint{font-size:12px;opacity:.5;line-height:1.7;margin-top:6px}
  .box{border:2px solid var(--line);padding:12px}
  .hint.ok{color:#3ddc84;opacity:1}
  .hint.err{opacity:1}
  .seg.wide{margin-bottom:4px}.seg.wide .btn{flex:1}
  /* a pane switch (Assets): | Vector assets | Bitmaps | as a control the panel's width — each pane a segment between
     upright bars; the chosen one white, raised a little, its bars in the channel colour; the other dim */
  .subtabs{display:flex;margin:2px 0 8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--panel)}
  .subtabs button{flex:1;position:relative;border:0;border-left:3px solid var(--line2);border-right:3px solid var(--line2);background:none;color:#fff;font-family:inherit;font-weight:700;font-size:14px;letter-spacing:.06em;padding:11px 0;cursor:pointer}
  .subtabs button span{opacity:.4}
  .subtabs button+button{margin-left:-3px}   /* one bar between two */
  .subtabs button:hover span{opacity:.75}
  .subtabs button.on{border-color:var(--acc);background:#1d1d2c;z-index:1}
  .subtabs button.on span{opacity:1}
  .peek{margin-top:8px;font-size:12px}.peek summary{cursor:pointer;opacity:.7}
  .peek pre{white-space:pre-wrap;max-height:220px;overflow:auto;margin:6px 0 0;padding:8px;border:1px solid var(--line2);font:12px/1.6 ui-monospace,monospace;opacity:.85}
  /* the selected layer's properties: group names on the left, lined up across groups; controls on the right */
  /* The selected layer's properties: one grid for all of its groups, four columns — the group's name,
     a control's own label, the control, its value — so sliders, values and checkboxes line up from
     group to group. A group and its body take no box of their own (display:contents): their children
     are the grid's items. A slider's three parts take columns 2–4; anything else spans 2–4. */
  .props{display:grid;grid-template-columns:max-content max-content minmax(0,1fr) max-content;column-gap:10px;row-gap:12px;align-items:center}
  .psec,.psec-b{display:contents}
  .psec-h{grid-column:1;font-size:12px;font-weight:600;opacity:.55;white-space:nowrap;display:flex;align-items:center;gap:4px}
  .psec-h.top{align-self:start;padding-top:10px}
  .psec-h.first{align-self:start;padding-top:1px}
  .psec-b>*{grid-column:2/-1;min-width:0;margin:0!important}
  .psec-b>.sl{display:contents}
  .psec-b>.sl>:nth-child(1){grid-column:2;white-space:nowrap;font-size:13px}
  .psec-b>.sl>:nth-child(2){grid-column:3;width:100%;margin:0}
  .psec-b>.sl>:nth-child(3){grid-column:4;font:600 12px var(--mono);text-align:right;opacity:.8;min-width:3.6em}
  .psec-b>.sl.off>:nth-child(2){grid-column:3/-1;font-size:12px;line-height:1.4}
  .psec-b>.sl.off>*{opacity:.5}
  .psec-b>.chk{display:flex}
  .psep{grid-column:1/-1;border-top:1px solid var(--line);margin:2px 0}
  .psec-b>.fxh{font-size:12px;font-weight:600;opacity:.75}
  .psec-b>.fxs{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px}
  .psec-b>.fxs>span{opacity:.7}
  .psec-b>.fxs>span.fxt{font-weight:600;opacity:.75}
  .fxs .linkbtn{border:0;background:none;color:var(--acc);font-size:12px;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
  .fxs .linkbtn:disabled{opacity:.35;cursor:default;text-decoration:none}
  .fxs>.fxa{display:flex;gap:12px}
  .info{display:inline-grid;place-items:center;width:15px;height:15px;font-size:12px;opacity:.7;cursor:help;font-weight:400}
  .info:hover{opacity:1;color:var(--acc)}
  .sub{font-size:12px;opacity:.6;margin-bottom:6px;display:flex;align-items:center;gap:4px}
  /* a colour: a row of its own, as a checkbox is — the swatch, its name, then "automatic" or a way back to it */
  .sw{display:flex;align-items:center;gap:10px;min-height:22px}
  .sw input[type=color]{width:30px;height:22px;padding:1px;background:var(--panel);border:2px solid var(--line);cursor:pointer;flex:none}
  .sw .auto{font-size:12px;opacity:.45}
  .sw .linkbtn{border:0;background:none;color:var(--acc);font-size:12px;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
  .cutmodel{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--line);padding:10px;margin-top:8px}
  .cutmodel b{font-size:13px}
  .mine-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .mine-head .cap{margin:0}
  .mine-head .btn{padding:4px 9px;font-size:12px}
  .folder,.loose{border:1px solid var(--line);margin-top:8px}
  .loose{border-color:transparent}
  .folder .tiles,.loose .tiles{padding:8px}
  .folder.over,.loose.over{outline:2px dashed var(--acc);outline-offset:2px}
  .fhead{display:flex;align-items:center;gap:8px;padding:5px 8px;background:var(--panel);font-size:13px}
  .fhead.plain{background:transparent;padding-left:2px;opacity:.75}
  .fhead .caret{border:0;background:transparent;color:inherit;cursor:pointer;width:18px;padding:0;font-size:12px}
  .fhead .fname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:text}
  .fhead .rename{flex:1;font-size:13px;padding:2px 6px;min-width:0}
  .fhead .fcount{font:600 11px var(--mono);opacity:.5}
  .fhead .btn{padding:2px 8px;font-size:12px}
  .pitem{border:1.5px dashed var(--line2);padding:10px;margin-top:12px}
  .pitem .thumb{margin-top:0;cursor:pointer;position:relative}
  .pitem[style*="--link"]{border-color:var(--link)}
  .pitem.passive{margin-left:18px;border-style:dotted}
  .pitem.on{border-color:var(--acc)!important}
  .pitem .thumb .del{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;border:1px solid var(--line2);background:var(--bg);color:#fff;font-size:15px;line-height:1;padding:0;cursor:pointer;display:none}
  .pitem .thumb:hover .del{display:block}
  .pitem .thumb .del:hover{background:#c0392b;border-color:#c0392b}
  .pitem .thumb .chain{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:4px;color:var(--link)}
  .pitem .thumb .chain svg{width:14px;height:14px}
  .thumb{margin-top:10px;display:grid;gap:4px;font-size:12px;opacity:.85}
  .thumb img{width:100%;max-height:180px;object-fit:contain;background:#000;border:2px solid var(--line2)}
  .rep{border-top:1px dashed var(--line2);margin-top:14px}
  .compare{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .compare figure{margin:0;display:grid;gap:4px;font-size:12px;opacity:.9}
  .compare img{width:100%;aspect-ratio:4/3;object-fit:contain;background:#000;border:2px solid var(--line2)}
  .compare.one{grid-template-columns:1fr}
  .cpv{width:100%;display:grid;place-items:center;background:#000;border:2px solid var(--line2);font-size:12px;opacity:.95}
  .cpv canvas{width:100%;height:100%;display:block}
  .ref{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;margin-top:8px;font-size:12px;opacity:.9}
  .ref img{width:56px;height:56px;object-fit:cover;border:2px solid var(--line2)}
  .ref .btn{padding:4px 9px;font-size:12px}
  .hint.err{color:#ff7a88;opacity:1;word-break:break-word}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chips button{border:2px solid var(--c,#fff);background:transparent;color:var(--c,#fff);padding:8px 12px;cursor:pointer;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chips button.on{background:var(--c,#fff);color:var(--ink)}
  .sl{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;gap:8px;margin-top:10px;font-size:13px}
  .sl input{accent-color:var(--acc);width:100%}
  .sl.off{opacity:.5}
  #marquee{position:fixed;z-index:20;pointer-events:none;border:1.5px dashed #fff;outline:1px solid rgba(7,7,12,.85);background:rgba(255,255,255,.08)}
  .about{font-size:12.5px;line-height:1.75;margin-top:10px;padding:10px 12px;border-left:2px solid var(--line2);background:rgba(255,255,255,.03);opacity:.85}
  .sl .why{font-size:12px;line-height:1.4}
  .sl output{font:600 12px var(--mono);text-align:right;opacity:.8}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .row.row3{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .row.row3 .btn{padding-inline:4px;overflow:hidden;text-overflow:ellipsis}
  .row3{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
  .ink{display:grid;grid-template-columns:1fr 44px auto;align-items:center;gap:8px;margin-top:10px;font-size:13px}
  .ink input[type=color]{width:44px;height:32px;padding:2px;background:var(--panel);border:2px solid var(--line);cursor:pointer}
  .ink .btn{padding:4px 9px;font-size:12px}
  .chk{display:flex;align-items:center;gap:10px;cursor:pointer;margin:8px 0}
  .chk input{width:17px;height:17px;accent-color:var(--acc);flex:none}
  .card{border:2px solid var(--line);border-left:8px solid var(--c);padding:12px;display:grid;gap:8px}
  .card .head{display:grid;grid-template-columns:44px 1fr;gap:8px}
  .card input[type=color]{width:44px;height:40px;padding:2px;background:var(--panel);border:2px solid var(--line);cursor:pointer}
  .card .two{display:grid;grid-template-columns:1fr 110px;gap:8px}
  .card .acts,.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
  .acts .btn{padding:4px 9px;font-size:12px}
  .sizes .chk{margin:6px 0;font-family:var(--mono);font-size:13px}
  .sizes .chk span{opacity:.5;margin-left:auto}
  .dl{display:grid;gap:8px}

  /* asset tiles */
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .tile{position:relative;aspect-ratio:1;border:2px solid var(--line);background:#1b1b2a;cursor:pointer;padding:0;display:grid;place-items:center}
  .tile:hover{border-color:#fff}
  .ptile{padding:0;overflow:hidden}
  .ptile img{width:100%;aspect-ratio:1;object-fit:cover;display:block;pointer-events:none}
  .ptile .kind{position:absolute;left:4px;bottom:4px;font:600 10px var(--mono);background:rgba(7,7,12,.75);padding:1px 5px}
  .tile canvas{width:100%;height:100%;display:block;pointer-events:none}
  .tile .x{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border:2px solid #fff;background:var(--ink);color:#fff;font-size:12px;line-height:1;cursor:pointer;padding:0;display:none}
  .tile:hover .x{display:block}
  .ptile .x{top:4px;right:4px}   /* the tile clips what sticks out */

  /* canvas column */
  #center{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-height:0;min-width:0}
  /* one line whatever the size is called: the name has a slot of its own (cut short, in full on hover),
     the help is behind an ⓘ — so nothing after it moves, and the canvas below keeps its height */
  #toolbar{display:flex;align-items:center;gap:14px;padding:0 18px;height:52px;border-bottom:2px solid var(--line);flex-wrap:nowrap;white-space:nowrap;overflow:hidden}
  #toolbar .name{font:600 13px var(--mono);letter-spacing:.06em;font-variant-numeric:tabular-nums;width:26ch;flex:none;overflow:hidden;text-overflow:ellipsis}
  #toolbar .help{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;opacity:.6;cursor:help;flex:none}
  #toolbar .help:hover{opacity:1}
  #stage{min-height:0;min-width:0;display:grid;place-items:center;padding:18px;overflow:hidden;background:#06060b;position:relative}
  #stage.focus #cv{outline:2px dashed var(--acc);outline-offset:4px}
  #focustag{position:absolute;top:8px;left:50%;transform:translateX(-50%);max-width:80%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--acc);color:var(--ink);font:700 11px var(--mono);letter-spacing:.06em;padding:3px 10px;pointer-events:none}
  #focustag.off{background:#555;color:#fff}
  .lhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .lbtns{display:flex;gap:6px}
  .focusbtn{border:1px solid var(--line2);background:transparent;color:inherit;font:700 10px var(--mono);letter-spacing:.08em;padding:3px 8px;cursor:pointer;opacity:.75}
  .focusbtn:hover{opacity:1}
  .focusbtn.on{background:var(--acc);border-color:var(--acc);color:var(--ink);opacity:1}
  #stage canvas{display:block;touch-action:none;box-shadow:0 0 0 2px var(--line2)}
  #stage.alpha canvas{background:repeating-conic-gradient(#3a3a48 0% 25%,#24242e 0% 50%) 0 0/20px 20px}
  #strip{display:flex;gap:14px;padding:12px 18px 8px;border-top:2px solid var(--line);overflow-x:scroll;overflow-y:hidden;align-items:flex-end;min-width:0}
  #strip::-webkit-scrollbar{height:12px}
  #strip::-webkit-scrollbar-track{background:var(--panel)}
  #strip::-webkit-scrollbar-thumb{background:#55556e;border:2px solid var(--panel)}
  #strip::-webkit-scrollbar-thumb:hover{background:#8080a0}
  .nm-row{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center;margin-top:8px}
  .nm-row span{font:600 12px var(--mono);opacity:.6}
  #strip figure{margin:0;cursor:pointer;outline:2px solid transparent;outline-offset:4px;flex:none}
  #strip figure.on{outline-color:var(--acc)}
  #strip canvas{display:block;height:84px;width:auto;background:#000}
  #strip.alpha canvas{background:repeating-conic-gradient(#3a3a48 0% 25%,#24242e 0% 50%) 0 0/12px 12px}
  #strip figcaption{font-size:12px;line-height:18px;font-weight:600;opacity:.75;margin-top:6px;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
  #strip figure{padding-bottom:2px}
  /* (scrollbars are styled with ::-webkit-scrollbar only: the standard scrollbar-* properties would switch them back to auto-hiding overlays) */

  /* layers */
  .layers{display:grid;gap:3px}
  .layer{display:grid;grid-template-columns:26px 26px 1fr auto;align-items:center;gap:4px;border:2px solid var(--line);background:var(--panel);padding:3px 6px 3px 3px;cursor:pointer;user-select:none}
  .layer.on{border-color:var(--acc)}
  .layer.over{box-shadow:0 -3px 0 var(--acc)}
  .layer.hidden .nm{opacity:.35}
  .layer .ic{border:0;background:transparent;width:26px;height:26px;cursor:pointer;font-size:14px;opacity:.85;padding:0}
  .layer .ic.off{opacity:.25}
  .layer .ic.pin{display:grid;place-items:center;font-size:12px;opacity:.9;cursor:help}
  .layer .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
  .layer .only{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-left:7px;vertical-align:1px}
  .chips.small button{padding:5px 9px;font-size:12px}
  .layer .kinds{display:flex;gap:5px;align-items:center;padding-left:6px}
  .layer .kind{display:grid;place-items:center;width:16px;height:16px;opacity:.5;cursor:help}
  .layer .kind.layout,.layer .kind.user{opacity:.8}
  .layer .kind.user{color:var(--acc)}
  .layer .kind.chain,.layer .kind.role{opacity:1}
  .layer .kind.chain,.layer .kind.role{cursor:pointer}
  .layer .kind.role:hover{filter:brightness(1.4)}
  .layer.flash{animation:flash .7s ease-out}
  @keyframes flash{from{box-shadow:0 0 0 2px var(--acc)}to{box-shadow:0 0 0 2px transparent}}
  .layer .kind.chain:hover{filter:brightness(1.4)}
  .layer .nm[title]{cursor:text}
  .layer.clip{margin-left:16px}
  .layer.clip .nm::before{content:"↓ ";color:var(--acc)}
  .layer .rename{font-size:13px;padding:2px 6px;min-width:0;width:100%}

  #tip{position:fixed;z-index:60;background:var(--panel);border:1px solid var(--line2);box-shadow:0 8px 24px rgba(0,0,0,.45);padding:10px 12px;font-size:12.5px;line-height:1.7;color:#fff;white-space:normal}
  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#fff;color:var(--ink);padding:12px 22px;font-weight:600;box-shadow:6px 6px 0 var(--acc);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:80vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #toast.on{opacity:1}
  body.drop::after{content:attr(data-drop);position:fixed;inset:12px;border:3px dashed var(--acc);background:rgba(10,10,18,.82);display:grid;place-items:center;font-size:28px;letter-spacing:.2em;z-index:45;pointer-events:none}
  #modal{position:fixed;inset:0;background:rgba(5,5,10,.86);display:grid;place-items:center;z-index:40}
  #modal[hidden]{display:none}
  #modal .dlg{width:min(540px,92vw);max-height:88vh;overflow:auto;background:var(--bg);border:3px solid #fff;box-shadow:12px 12px 0 var(--acc);padding:26px;display:grid;gap:14px}
  #modal .bar{height:14px;border:2px solid #fff;background:var(--panel)}
  #modal .bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .15s}
  #modal .count{font:600 15px var(--mono)}
  #modal h2{font:400 34px "Bebas Neue",var(--ui);letter-spacing:.06em;margin:0}
