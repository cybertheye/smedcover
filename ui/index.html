<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmedCover</title>
<style>
  /* Bundled open fonts (SIL OFL, see fonts/OFL-*.txt) so covers look the same on every platform. */
  @font-face{font-family:"Noto Sans SC";src:url("fonts/NotoSansSC.ttf");font-weight:100 900;font-display:block}
  @font-face{font-family:"Bebas Neue";src:url("fonts/BebasNeue-Regular.ttf");font-weight:100 900;font-display:block}
  @font-face{font-family:"JetBrains Mono";src:url("fonts/JetBrainsMono.ttf");font-weight:100 800;font-display:block}

  /* Frosted glass over the cover: the page's ground is the cover itself, small and blurred (#ambient), and every
     panel is a pane of glass over it (.glass), letting its colours through. Where the glass would slow the canvas,
     or the web view cannot blur, html.solid makes the panes plain and translucent (see glassWatch in app.js). */
  :root{color-scheme:dark;--bg:#0b0b11;--ink:#15151c;--acc:#fcee0a;--acc-ink:#15151c;--acc-lite:color-mix(in srgb,var(--acc) 55%,#fff);
        --text:#f5f5f7;--text2:rgba(245,245,247,.68);--text3:rgba(245,245,247,.5);
        --panel:rgba(255,255,255,.05);--line:rgba(255,255,255,.12);--line2:rgba(255,255,255,.24);
        --field:rgba(10,10,16,.32);
        --glass:rgba(255,255,255,.075);--glass2:rgba(255,255,255,.14);--solid:rgba(27,27,38,.94);--solid2:rgba(44,44,58,.96);
        --glass-line:rgba(255,255,255,.16);--glass-hi:inset 0 1px 0 rgba(255,255,255,.2);--glass-drop:0 24px 60px rgba(0,0,0,.38);
        --blur:blur(30px) saturate(170%);
        --ui:"Noto Sans SC",-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--ui);font-size:14px;overflow:hidden}
  button,input,select,textarea{font:inherit;color:inherit}
  #ambient{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  #ambient canvas{position:absolute;left:-10%;top:-10%;width:120%;height:120%;filter:blur(64px) saturate(150%) brightness(.62)}
  #ambient::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 45%,rgba(10,10,18,.12),rgba(8,8,14,.66))}
  .glass{background-color:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-line);box-shadow:var(--glass-hi),var(--glass-drop)}
  html.solid .glass{background-color:var(--solid);-webkit-backdrop-filter:none;backdrop-filter:none}
  .app{position:relative;z-index:1;display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr);height:100vh;padding:12px;gap:12px}

  /* top bar: the profile and channel, undo and redo, then Surprise me, Export and the ⋯ menu */
  header{display:flex;align-items:center;gap:12px;height:56px;padding:0 10px 0 18px;border-radius:18px}
  header h1{font:400 26px "Bebas Neue",sans-serif;letter-spacing:.08em;margin:0 2px 0 0}
  header .sep{width:1px;height:24px;background:var(--line2)}
  /* the window's close, minimise and zoom buttons sit at the top bar's left end (ownTitleBar in app.js): on a Mac its own
     float over it; on Windows and Linux the page draws them (#winbtns), at the same place and size and in a Mac's colours */
  html.ownbar header{padding-left:96px}
  @media(max-width:1200px){html.ownbar header .grp>span{display:none}}   /* "Saved as you go" gives the buttons' room back */
  #winbar{position:fixed;left:0;right:0;top:0;height:22px;z-index:45;display:none}
  body:has(#settings:not([hidden])) #winbar,body:has(#modal:not([hidden])) #winbar,body:has(#ask:not([hidden])) #winbar,body:has(#deal:not([hidden])) #winbar{display:block}
  #winbtns{position:fixed;left:30px;top:32px;z-index:46;display:flex;gap:6px}
  html:not(.ownbar) #winbtns{display:none}   /* full screen */
  #winbtns button{width:14px;height:16px;padding:0;border:0;background:none;display:grid;place-items:center}
  #winbtns span{width:12px;height:12px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2)}
  #winbtns .close span{background:#ff5f57;color:#4d0000}
  #winbtns .min span{background:#febc2e;color:#995700}
  #winbtns .zoom span{background:#28c840;color:#006500}
  #winbtns svg{opacity:0}
  #winbtns:hover svg{opacity:1}   /* their signs while the pointer is over any of them */
  #winbtns button:active span{filter:brightness(.78)}
  #winbtns.idle:not(:hover) span{background:rgba(235,235,245,.22)}   /* grey while another window is the one in use */
  .crumb{display:flex;align-items:center;gap:4px;min-width:0}
  .crumb>span{color:var(--text3)}
  .crumb select{width:auto;max-width:190px;min-width:0;border:0;background:transparent;padding:6px 8px;border-radius:10px;cursor:pointer}
  .crumb select:hover{background:rgba(255,255,255,.08)}
  .crumb .dot{width:9px;height:9px;border-radius:50%;background:var(--acc);flex:none}
  .grp{display:flex;align-items:center;gap:6px}
  .grp>span{font-size:12px;color:var(--text3);white-space:nowrap}
  .spacer{flex:1}
  .ibtn{width:40px;height:40px;display:grid;place-items:center;border:0;border-radius:12px;background:transparent;color:var(--text);cursor:pointer;padding:0}
  .ibtn:hover:not(:disabled){background:rgba(255,255,255,.1)}
  .ibtn:disabled{opacity:.35;cursor:default}
  .ibtn.on,.ibtn.on:hover:not(:disabled){background:rgba(255,255,255,.18)}
  .btn{border:1px solid var(--line2);background:rgba(255,255,255,.06);padding:7px 12px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
  .btn:hover:not(:disabled){background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.36)}
  .btn:disabled{opacity:.3;cursor:default}
  .btn.on,.btn.on:hover:not(:disabled){background:rgba(255,255,255,.9);color:var(--ink);border-color:transparent}   /* selected: as it is under the pointer too */
  .btn.solid{background:var(--acc);color:var(--acc-ink);border-color:transparent;font-weight:700}
  .btn.solid:hover:not(:disabled){background:var(--acc);filter:brightness(1.08)}
  .btn.wide{width:100%;padding:11px}
  .btn.cta{height:40px;padding:0 18px;font-size:14px;display:inline-flex;align-items:center;gap:8px;border-radius:12px}
  .btn.cta svg{flex:none}
  .btn.cta.glassy{background:var(--glass2);border:1px solid rgba(255,255,255,.24);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}
  .btn.cta.glassy:hover:not(:disabled){background:rgba(255,255,255,.2)}
  .btn.cta kbd{font:500 11px var(--mono);color:rgba(255,255,255,.65);border:1px solid rgba(255,255,255,.28);border-radius:6px;padding:1px 5px}   /* the key that does it too */
  /* a few ways side by side, the one chosen lit (see segs in app.js): a well 34 px high, as every control of the app is */
  .seg{display:flex;padding:2px;gap:2px;min-height:34px;border-radius:10px;background:rgba(0,0,0,.28);border:1px solid var(--line)}
  .seg .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:28px;padding:3px 12px;border:0;background:transparent;border-radius:8px;color:var(--text2)}
  .seg .btn:focus-visible{outline:none;box-shadow:0 0 0 2px var(--acc)}
  .seg .btn:hover:not(:disabled){background:rgba(255,255,255,.08);color:var(--text)}
  .seg .btn.on,.seg .btn.on:hover:not(:disabled){background:rgba(255,255,255,.9);color:var(--ink);font-weight:700}
  .seg.big .btn{padding:8px 20px;font-size:15px}
  header select{background:var(--field);border:1px solid var(--line);padding:6px 8px;max-width:180px}

  /* a sheet's foot: what is seldom wanted, last */
  .sheet-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;align-items:flex-start;gap:12px}
  /* the app's small text button, for what is done seldom or at one remove (a look's effects cleared, a size exported
     alone, a model deleted, another window opened…), in the danger colour where a click cannot be undone */
  .linkbtn,.tbtn{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 8px;border:0;border-radius:8px;background:none;color:rgba(245,245,247,.82);font:500 12.5px var(--ui);white-space:nowrap;text-decoration:none;text-align:left;cursor:pointer}
  .linkbtn:hover:not(:disabled),.tbtn:hover:not(:disabled){background:rgba(255,255,255,.08);color:#fff}
  .linkbtn:focus-visible,.tbtn:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
  .linkbtn:disabled,.tbtn:disabled{opacity:.35;cursor:default}
  .linkbtn.on,.tbtn.on{background:rgba(255,255,255,.1);color:#fff;cursor:default}
  .linkbtn.danger,.tbtn.danger{color:#ff9a8a}
  .sheet-foot .linkbtn{margin-left:-8px}   /* its words in line with the sheet's */
  .togrow{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:14px;background:rgba(0,0,0,.2);border:1px solid var(--line)}
  /* the app's one switch: on, lit white as a segment chosen is, its knob dark at the right end */
  .tog{width:36px;height:22px;border-radius:11px;background:rgba(255,255,255,.2);position:relative;border:0;cursor:pointer;padding:0;flex:none;transition:background .15s}
  .tog::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:8px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:left .15s,background .15s}
  .tog.on{background:rgba(255,255,255,.9)}
  .tog.on::after{left:17px;background:var(--ink);box-shadow:none}
  .tog:disabled{opacity:.35;cursor:default}
  .tog:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  /* Layout → the layout presets, two to a row, each a card: this cover laid out by it, its name and a word under it;
     the canvas as it is first, outlined in the channel colour. Over a preset's picture, under the pointer, the way it
     is put on; at its corner ⋯, its menu. */
  .presets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .preset{position:relative;display:flex;flex-direction:column;border-radius:12px;background:rgba(0,0,0,.22);border:1px solid var(--line);min-width:0}
  .preset:hover{border-color:var(--line2)}
  .preset.previewing{border-color:rgba(255,255,255,.5)}
  .preset.now{border:2px solid var(--acc)}
  .preset .pthumb{position:relative;display:block;width:100%;aspect-ratio:16/9;padding:0;border:0;border-radius:10px 10px 0 0;overflow:hidden;background:rgba(0,0,0,.35);cursor:pointer}
  .preset.now .pthumb{cursor:default}
  .preset .pthumb canvas{display:block;width:100%;height:100%;object-fit:contain}   /* contain: a tall cover shown whole */
  .preset .pthumb .go{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.5);opacity:0;transition:opacity .12s}
  .preset .pthumb .go span{height:28px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.92);color:#15151c;font-size:12px;font-weight:700;display:flex;align-items:center;white-space:nowrap}
  .preset:hover .pthumb .go,.preset .pthumb:focus-visible .go{opacity:1}
  .preset .pcap{flex:1;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:7px 9px;font-size:12px;min-width:0;cursor:pointer}
  .preset.now .pcap{cursor:default}
  .preset .pcap .nm{min-width:0;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow-wrap:anywhere}   /* a long name on two lines at most */
  .preset .pcap .pv{flex:none;color:var(--text2);white-space:nowrap}
  .preset:not(.now):not(.previewing) .pcap .pv{display:none}   /* a preset's word, while the canvas shows the cover laid out by it (see hoverPreset) */
  .preset .pcap input{flex:1;min-width:0;padding:2px 6px;font-size:12px;font-weight:700;border-radius:6px}
  .preset .more{position:absolute;right:6px;top:6px;z-index:2;width:28px;height:22px;padding:0;border:0;border-radius:7px;background:rgba(20,20,28,.72);color:#fff;font-size:14px;line-height:1;cursor:pointer;opacity:0;transition:opacity .12s}
  .preset:hover .more,.preset:focus-within .more,.preset .more[aria-expanded=true]{opacity:1}
  .preset .more:hover{background:rgba(20,20,28,.92)}
  .presets .preset .chmenu{right:6px;top:32px;white-space:nowrap}   /* its ⋯ menu: the channel cards' (Settings), under the ⋯ */
  .presets .preset .chmenu[hidden]{display:none}
  .presets-none{margin:8px 0 0!important}
  /* Assets → ways to add, four to a row; then shelves, each with its name, how many, and "All" */
  .quicks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
  .quick{height:68px;border-radius:14px;border:1px solid var(--line2);background:rgba(255,255,255,.07);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;cursor:pointer;padding:0}
  .quick:hover{background:rgba(255,255,255,.13)}
  .quick.on{border-color:color-mix(in srgb,var(--acc) 70%,transparent);background:color-mix(in srgb,var(--acc) 14%,transparent)}
  .quick .sw-chip{width:18px;height:18px;border-radius:5px;box-shadow:0 0 0 1px rgba(255,255,255,.3)}
  /* the search over every shelf: a field with its magnifier, and ✕ while it holds words */
  .asearch{display:flex;align-items:center;gap:8px;height:38px;padding:0 5px 0 12px;border-radius:12px;background:var(--field);border:1px solid var(--line2);color:var(--text3)}
  .asearch:focus-within{border-color:color-mix(in srgb,var(--acc) 70%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 14%,transparent)}
  .asearch input[type=text]{flex:1;min-width:0;height:100%;padding:0;border:0;border-radius:0;background:transparent;font-size:13px;box-shadow:none}
  .asearch input::placeholder{color:var(--text3)}
  .asearch .clr{flex:none;width:28px;height:28px;border:0;border-radius:8px;background:transparent;color:var(--text2);font-size:12px;cursor:pointer;padding:0}
  .asearch .clr:hover{background:rgba(255,255,255,.12);color:#fff}
  .shelf{display:grid;gap:10px}
  .shelf-h{display:flex;align-items:baseline;gap:12px}
  .shelf-h .cap .n{color:var(--text3)}
  .shelf-h .info{align-self:center}   /* the row is lined up by baselines, which a drawn ⓘ has none of */
  .shelf-h .linkbtn:first-of-type{margin-left:auto}
  .shelf-groups{display:grid;gap:12px}
  .tiles.shapes{grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
  /* the colour block's edges: grey shapes on a lighter ground, the one in use in the accent (not the channel's colour on each) */
  .shp{height:38px;min-width:0;border-radius:9px;border:1px solid var(--line);background:rgba(0,0,0,.22);padding:4px;color:var(--text3);display:flex;cursor:pointer}
  .shp svg{width:100%;height:100%;border-radius:5px;background:rgba(255,255,255,.1)}
  .shp:hover{border-color:#fff;color:var(--text2)}
  .shp.on{border:2px solid var(--acc);color:var(--acc);padding:3px}

  /* Look → every look as a card, the cover drawn in it; the cards scroll on their own so the look's settings stay near */
  .lookgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:max-content;gap:10px;max-height:min(48vh,440px);overflow-y:scroll;padding:2px 4px 2px 2px;margin:0 -4px 0 -2px}   /* scroll, not auto: see .scroll */
  .lookgrid::-webkit-scrollbar{width:8px}.lookgrid::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:4px}
  .lookcard{position:relative;display:flex;flex-direction:column;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:rgba(0,0,0,.25);color:var(--text);cursor:pointer;text-align:left}
  .lookcard:hover{border-color:rgba(255,255,255,.5)}
  .lookcard.on{border:2px solid var(--acc)}
  /* the card is two buttons: the look (its picture and name) and, over the name's right end, its ♡ */
  .lookpick{display:flex;flex-direction:column;width:100%;padding:0;border:0;border-radius:0;background:none;color:inherit;text-align:left;cursor:pointer}
  .lookpick:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
  .lookheart{position:absolute;right:4px;bottom:3px;display:grid;place-items:center;width:26px;height:26px;padding:0;border:0;border-radius:8px;background:none;color:var(--text2);cursor:pointer}
  .lookheart:hover{background:rgba(255,255,255,.1);color:var(--text)}
  .lookheart:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
  .lookheart.on,.lookheart.on:hover{color:#ff5b6e}
  .lookheart.on path,.lookchips .ico path{fill:currentColor}   /* liked: the heart filled, a warm red (the chip's in its own colour) */
  .lookchips .rchip .ico{vertical-align:-2px;margin-right:4px}
  .lookcard .lookpic{flex:none;display:block;width:100%;aspect-ratio:16/9;height:auto;object-fit:contain;background:rgba(0,0,0,.35)}   /* contain: a tall cover shown whole */
  .lookcard .nm{padding:7px 32px 8px 9px;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}   /* room at its end for the ♡ */
  .lookcard .badge{position:absolute;left:6px;top:6px;padding:1px 8px;border-radius:999px;background:var(--acc);color:var(--acc-ink);font-size:11px;font-weight:700}
  .lookgrid .lookcard[hidden]{display:none}
  .lookgrid:not(:has(>.lookcard:not([hidden]))){display:none}   /* no card shown (♥ Liked with nothing liked): no empty grid above the line saying so */
  .lookgrid.finding .lookcard.on{order:-1}   /* the profile's own look first while the search or a chip sorts the cards (under ♥ Liked, sortLooks puts it in its place) */
  .hint.lookgrid-none{margin:0}   /* .hint, later on, would give it a margin over the sheet's own gap */
  /* above the cards: the search and a chip for each kind of look */
  .lookfind{display:flex;flex-direction:column;gap:10px}
  .lookfind-q{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:12px;border:1px solid var(--line2);background:rgba(10,10,16,.3);color:var(--text3);cursor:text}
  .lookfind-q:focus-within{border-color:color-mix(in srgb,var(--acc) 70%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 14%,transparent)}
  .lookfind-q input[type=text]{flex:1;min-width:0;height:100%;padding:0;border:0;border-radius:0;background:transparent;color:var(--text);font-size:13px;box-shadow:none}
  .lookchips{gap:6px}
  /* under the cards, Tune this look: its heading opens and shuts the look's description, a chevron at its end as on the drawer's groups */
  .tunehead{display:flex;align-items:center;gap:6px;margin-bottom:6px}
  .tunehead b{min-width:0}
  .tunehead.folds{cursor:pointer;user-select:none}
  .tunehead .fold{flex:none;margin-left:auto;width:26px;height:26px;padding:0;border:0;border-radius:8px;background:transparent;color:var(--text2);display:grid;place-items:center;cursor:pointer}
  .tunehead.folds:hover .fold{background:rgba(255,255,255,.08);color:var(--text)}
  .tunehead .chev{width:7px;height:7px;margin:0 5px 0 0;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
  .tunehead .fold[aria-expanded=true] .chev{transform:rotate(45deg);margin:0 0 5px}
  #pvtag{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);z-index:4;padding:6px 14px;border-radius:999px;background:rgba(28,30,40,.82);border:1px solid rgba(255,255,255,.22);font-size:12.5px;white-space:nowrap;pointer-events:none}
  #pvtag[hidden],#stage.v3 #pvtag{display:none}

  /* the ⋯ menu, under its button */
  #menu{position:fixed;z-index:42;width:320px;max-height:calc(100vh - 80px);overflow-y:auto;padding:8px;border-radius:18px;display:flex;flex-direction:column;gap:2px;background-color:rgba(28,30,40,.62)}
  html.solid #menu{background-color:var(--solid2)}
  #menu[hidden]{display:none}
  #menu .mg{font-size:11px;color:var(--text3);letter-spacing:.06em;padding:8px 12px 4px}
  #menu .mi{display:flex;align-items:center;gap:12px;min-height:40px;padding:6px 10px 6px 12px;border-radius:11px;border:0;background:transparent;color:var(--text);text-align:left;width:100%;cursor:pointer}
  #menu .mi:hover{background:rgba(255,255,255,.12)}
  #menu .mi .mt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  #menu .mi .mt small{font-size:11.5px;color:var(--text3);line-height:1.4}
  #menu .mi .sc{font-size:12px;color:var(--text3)}
  #menu .mi kbd.sc{flex:none;font:500 12.5px -apple-system,"Segoe UI",var(--ui);letter-spacing:.04em}
  #menu .mi .light{display:flex;align-items:center;gap:6px;min-width:0}
  #menu .mi .light>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #menu .mi.danger{color:#ff9a8a}
  #menu .mi .chev{flex:none;width:7px;height:7px;margin-right:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);opacity:.5}
  #menu .mi .chev.open{transform:rotate(45deg)}
  #menu .mi.sub{padding-left:24px;min-height:36px}
  #menu .foot{font-size:11.5px;line-height:1.55;color:var(--text3);padding:8px 12px 6px}
  #menu .sep{height:1px;background:var(--line);margin:4px 8px}
  #menu .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0;padding:6px 8px 4px 12px;font-size:13px;color:var(--text2)}

  /* body: the dock | the open sheet | the canvas | the selected layer's properties. Each scrolls on its own;
     the canvas always stays in view. */
  .body{display:grid;grid-template-columns:76px var(--lw,340px) minmax(0,1fr) var(--rw,320px);gap:12px;min-height:0}
  /* the side columns are as wide as their edge is dragged (see columns() in app.js) */
  aside{position:relative}
  .split{position:absolute;top:18px;bottom:18px;width:9px;cursor:col-resize;z-index:5;touch-action:none;border-radius:5px}
  #left .split{right:-11px}
  #right .split{left:-11px}
  .split:hover,.split.on{background:linear-gradient(90deg,transparent 3px,var(--acc) 3px,var(--acc) 5px,transparent 5px)}
  aside{display:flex;flex-direction:column;min-height:0;border-radius:22px}
  #left>.scroll,#right>.scroll{border-radius:22px}
  #right>.scroll{padding:18px 4px 40px 14px}   /* 4 px and the bar's 10 on the right (see .scroll) */
  #right .box{border:0;background:none;padding:0;border-radius:0}   /* the column is the box: the selected layer's properties fill it */
  /* the drawer of the selected layer's properties: shut, the canvas takes its column */
  .body.nodrawer{grid-template-columns:76px var(--lw,340px) minmax(0,1fr)}
  .body.nodrawer #right{display:none}
  /* a narrow window with the drawer open: the drawer takes the sheet's place, the dock's buttons bringing the sheet back */
  .body.tight{grid-template-columns:76px minmax(0,1fr) var(--rw,320px)}
  .body.tight #left{display:none}
  /* the drawer's head: the layer's tile, as its row in the layer list has it, its name, what kind of layer it is and at
     which sizes it shows; then hide, duplicate, delete and close */
  #right .dhead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"tile name name" "tile sub acts";align-items:center;column-gap:10px;row-gap:0;margin:0 0 10px;padding-left:2px}
  #right .dhead .th{grid-area:tile}
  #right .dhead b{grid-area:name;padding-right:34px;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #right .dhead [data-close]{grid-area:name;justify-self:end}   /* over the end of the name's line, which has the rest of it */
  #right .dhead small{grid-area:sub;font-size:12px;color:rgba(245,245,247,.72);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #right .dhead .acts{grid-area:acts;display:flex;gap:2px}
  #right .dhead .ib{width:28px;height:28px;border-radius:8px;color:rgba(245,245,247,.82)}
  #right .dhead .ib:hover:not(:disabled){color:#fff}
  #right .dhead .ib svg{width:16px;height:16px}
  .ib:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
  /* the dock: one button per sheet, the canvas's help at its foot */
  #dock{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border-radius:22px;min-height:0}
  #dock button{width:64px;height:64px;border:0;border-radius:16px;background:transparent;color:var(--text2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;cursor:pointer;padding:0}
  #dock button:hover{background:rgba(255,255,255,.08);color:var(--text)}
  #dock button.on{background:rgba(255,255,255,.18);color:#fff;font-weight:500;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
  #dock .help{width:44px;height:44px;margin-top:auto;color:var(--text3)}
  .sheet-h{display:flex;flex-direction:column;gap:4px;margin-bottom:2px}
  .sheet-h b{font-size:19px;font-weight:700}
  /* overflow-y:scroll, not auto with scrollbar-gutter:stable: WebKit keeps a gutter as wide as its own scrollbar (17 px)
     until there is something to scroll, then draws this one (10 px), so whatever is in it moved each time a group opened
     or shut; always there, with nothing to scroll it shows no thumb and its track is clear */
  .scroll{overflow-y:scroll;min-height:0;padding:20px 8px 40px 18px;display:flex;flex-direction:column;gap:16px}   /* on the right 8 px and the bar's 10: as far from either edge */
  .scroll>*{flex:none}
  .scroll::-webkit-scrollbar{width:10px}
  /* where a scrollbar takes room (Windows, Linux, a Mac set to show them always: html.bars, set in start() in app.js), every one is a thin one on the glass, as the sheets' */
  :where(html.bars) ::-webkit-scrollbar{width:10px;height:10px}
  :where(html.bars) ::-webkit-scrollbar-track,:where(html.bars) ::-webkit-scrollbar-corner{background:transparent}
  :where(html.bars) ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border:3px solid transparent;background-clip:padding-box;border-radius:6px}
  :where(html.bars) ::-webkit-scrollbar-thumb:hover{background-color:rgba(255,255,255,.3)}
  /* a pane's scrollbar is not cut to the pane's rounded corners (WebKit draws it over them, as Chromium does), so its
     track stops short of them, a little less than the corner's radius from either end: the bar stays inside the pane */
  :where(html.bars) #menu::-webkit-scrollbar-track{margin:14px 0}
  :where(html.bars) #fpop::-webkit-scrollbar-track{margin:12px 0}
  :where(html.bars) :is(#letterwin,#cropwin,#weavewin,#brushwin)::-webkit-scrollbar-track{margin:16px 0}
  :where(html.bars) #modal .dlg::-webkit-scrollbar-track{margin:20px 0}
  .scroll::-webkit-scrollbar-track{background:transparent;margin:18px 0}
  .scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border:3px solid transparent;background-clip:padding-box;border-radius:6px}
  .scroll::-webkit-scrollbar-thumb:hover{background-color:rgba(255,255,255,.3)}

  label.cap,.cap{display:block;font-size:12px;color:var(--text2);letter-spacing:.04em;margin-bottom:8px}
  /* a field: the dark well every control of the app sits on; a number one typed only, without the system's arrows (↑ ↓ step it) */
  input[type=text],input[type=password],input[type=number],textarea,select{width:100%;background:rgba(0,0,0,.28);border:1px solid var(--line);padding:9px 12px;border-radius:10px}
  :is(input[type=text],input[type=password],input[type=number],textarea,select):hover:not(:disabled):not(:focus){border-color:rgba(255,255,255,.28)}
  input[type=number]{appearance:textfield;-moz-appearance:textfield}
  input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  /* one of a few, each a row (the cut-out's engine): a ring, lit white round a dark middle when chosen */
  input[type=radio]{appearance:none;-webkit-appearance:none;flex:none;width:18px;height:18px;margin:0;border-radius:50%;border:1.5px solid rgba(255,255,255,.45);background:rgba(0,0,0,.28);cursor:pointer}
  input[type=radio]:checked{border:5px solid rgba(255,255,255,.9);background:var(--ink)}
  input[type=radio]:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  select{cursor:pointer}
  option{background:#22222e;color:var(--text)}   /* a dropdown's list, where the system draws it (WebView2) */
  input[type=text]:disabled{opacity:.35}
  textarea{height:100px;resize:vertical;font-size:16px;line-height:1.6}
  input:focus,textarea:focus,select:focus{outline:none;border-color:color-mix(in srgb,var(--acc) 70%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 14%,transparent)}
  .hint{font-size:12px;color:var(--text3);line-height:1.7;margin-top:6px}
  .box{border:1px solid var(--line);background:rgba(0,0,0,.16);border-radius:16px;padding:14px}
  .hint.ok{color:#3ddc84;opacity:1}
  .hint.err{opacity:1}
  .seg.wide{margin-bottom:4px}.seg.wide .btn{flex:1}
  /* a pane switch (Assets): | Vector assets | Bitmaps | as a control the panel's width — each pane a segment between
     upright bars; the chosen one white, raised a little, its bars in the channel colour; the other dim */
  .subtabs{display:flex;gap:2px;padding:3px;margin:2px 0 8px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid var(--line)}
  .subtabs button{flex:1;border:0;border-radius:9px;background:none;color:var(--text2);font-family:inherit;font-weight:500;font-size:14px;padding:8px 0;cursor:pointer}
  .subtabs button:hover{background:rgba(255,255,255,.08);color:var(--text)}
  .subtabs button.on{background:rgba(255,255,255,.9);color:var(--ink);font-weight:700}
  .peek{margin-top:8px;font-size:12px}.peek summary{cursor:pointer;opacity:.7}
  .peek pre{white-space:pre-wrap;max-height:220px;overflow:auto;margin:6px 0 0;padding:8px;border:1px solid var(--line2);font:12px/1.6 ui-monospace,monospace;opacity:.85}
  /* The selected layer's properties, in the drawer: its groups one under another, each a line — its name, an ⓘ, what it
     is set to while it is shut and a chevron, the whole line the button that opens and shuts it — over its controls,
     one under another. One family of controls, each a row 34 px high: those that hold a value on a dark well (a scrub
     bar, a colour, a choice among many, a few ways side by side), the on/off ones a row with the switch at its end.
     Down the right runs a rail 30 px wide where only the ↺ stands that puts a control back to its default, so a look
     down that edge finds every change; a value moved off its default is in the channel colour (--acc-lite), and its
     group's line says so while shut: a dot, and that value first. A popover of the bar over the canvas holds a group's
     controls the same way. */
  .props{display:flex;flex-direction:column}
  .psec{border-top:1px solid rgba(255,255,255,.09)}
  .props>.psec:first-child{border-top:0}
  .psec-h{position:relative;display:flex;align-items:center;gap:6px;min-height:40px;margin:2px 0;padding:0 6px 0 8px;border-radius:10px;user-select:none;-webkit-user-select:none}
  .psec-h:hover{background:rgba(255,255,255,.06)}
  .psec-h:has(.tg:focus-visible){box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 80%,transparent)}
  .psec-h .tg{flex:none;border:0;background:none;padding:0;color:var(--text);font:700 13px var(--ui);white-space:nowrap;cursor:pointer;outline:none}
  .psec-h .tg::after{content:"";position:absolute;inset:0;border-radius:10px}   /* the whole line is its button */
  .psec-h .info{z-index:1;top:0;width:22px;height:22px;margin-left:-3px;display:grid;place-items:center;border-radius:6px}
  .psec-h .info svg{width:14px;height:14px}
  .psec-h .sum{flex:1;min-width:0;display:flex;align-items:center;justify-content:flex-end;gap:7px;font-size:12px;color:rgba(245,245,247,.74);white-space:nowrap}
  .psec-h .sum .said{min-width:0;overflow:hidden;text-overflow:ellipsis}
  .psec-h .sum em{font-style:normal;color:var(--acc-lite)}
  .psec-h .sum .chg{flex:none;width:6px;height:6px;border-radius:3px;background:var(--acc)}
  .psec.open>.psec-h .sum .said{display:none}   /* open, only the dot */
  .psec-h .chev{flex:none;display:grid;width:16px;height:16px;color:rgba(245,245,247,.62);transition:transform .15s;pointer-events:none}   /* turned (open), it would be drawn over the line's button and take its clicks */
  .psec-h:hover .chev{color:var(--text)}
  .psec.open>.psec-h .chev{transform:rotate(90deg)}
  .psec:not(.open)>.psec-b{display:none}
  .psec-b{display:flex;flex-direction:column;gap:8px;min-width:0;padding:2px 2px 14px}
  .psec-b>*{min-width:0;margin-top:0!important;margin-bottom:0!important;margin-left:0!important}
  .psec-b>:not(.sc):not(.cr){margin-right:30px!important}   /* the rail */
  .psec-b>.sc,.psec-b>.cr{margin-right:0!important}
  .psec-b .hint{margin:0;color:rgba(245,245,247,.74)}
  .psec-b .hint.err{color:#ff7a88}
  .psec-b .cap{color:rgba(245,245,247,.74)}
  .psec-b>.cap{margin:2px 30px -3px 2px!important;letter-spacing:0}   /* a caption, close to what it names */
  .psec-b .ico{display:grid;place-items:center}
  .psec-b textarea,.psec-b input[type=text]{width:auto}
  .psec-b textarea{height:64px;padding:7px 10px;border-radius:10px;background:rgba(0,0,0,.28);font-size:14px;line-height:1.6}
  .psec-b input[type=text]{height:34px;padding:0 10px;border-radius:10px;background:rgba(0,0,0,.28)}
  .psec-b .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:34px;padding:0 12px;border-color:rgba(255,255,255,.2)}
  .psec-b .btn.wide{width:auto}
  .psec-b .btn svg{flex:none;width:15px;height:15px}
  .psec-b .btn:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
  .psec-b>.row{margin:0;gap:8px}
  :is(.psec-b,.lgrid,#brush-box) .seg{min-height:34px;padding:2px;gap:2px;border-radius:10px;background:rgba(0,0,0,.28)}
  :is(.psec-b,.lgrid,#brush-box) .seg .btn{flex:1 1 0;min-width:0;min-height:28px;padding:3px 5px;border:0;border-radius:8px;font-size:12.5px;line-height:1.2;white-space:normal}   /* a long name in two lines rather than cut */
  :is(.psec-b,.lgrid,#brush-box) .seg .btn svg{width:14px;height:14px}
  :is(.psec-b,.lgrid,#brush-box) .seg .btn:focus-visible{outline:none;box-shadow:0 0 0 2px var(--acc)}
  :is(.psec-b,.lgrid,#brush-box) .seg .btn:disabled{opacity:.45}
  .psep{height:8px}
  .psec-b>.fxh{font-size:12px;font-weight:600;color:rgba(245,245,247,.74)}
  .psec-b>.fxs{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:28px;font-size:12px;color:rgba(245,245,247,.74)}
  .psec-b>.fxs>span.fxt{font-weight:600}
  .artback{margin:0 0 0 84px}   /* under the figure's graphic, past the label column */
  /* a column of the app's controls (the Look sheet's settings of the look), and a word typed with its name before it */
  .kcol{display:flex;flex-direction:column;gap:8px;margin-top:10px}
  .kcol>:not(.sc){margin-right:30px}   /* the rail, as the bars' */
  .kcol>.btn.wide{width:auto}
  .trow{display:grid;grid-template-columns:76px minmax(0,1fr);gap:8px;align-items:center;font-size:13px}
  .trow>span:first-child{color:var(--text2)}
  .recipe>.sc,.recipe>.tacts,.recipe>.hint+.sc{margin-top:8px}
  .sc~.tacts{margin-right:30px}.recipe>.btn.wide{width:calc(100% - 30px)}   /* the rail, as the bars' */
  .layscope .seg .btn{flex:1;padding-left:6px;padding-right:6px}   /* the Style tab's template box: the scope it changes, the toolbar's own */
  .layown{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;margin:0 0 10px;padding:6px 8px;border:1px dashed var(--acc)}
  .layown .linkbtn{font-size:12px}
  /* a small text button, for what is done seldom or cannot be undone at a click: a look's effects cleared, a scene
     object put back, every look effect removed (in the danger colour) */
  .fxs .linkbtn,.sizes-picks .linkbtn{font-size:12px}
  .tacts{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:2px}
  .fxs>.fxa{display:flex;gap:2px}
  .psec-b>.fxs>span.jump{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
  .psec-b>.fxs>span.jump:hover{color:var(--text)}
  /* the sizes a layer shows at, in its properties: one well, lit where it shows, the one on the canvas ringed in the
     channel colour; the quick groups under it */
  .sizes-ctl{display:flex;flex-direction:column;gap:6px}
  .sizes-ctl .cap{display:flex;align-items:center;gap:4px;margin:2px 0 0 2px}
  .sizes-row,.multi{display:flex;flex-wrap:wrap;gap:2px;min-height:34px;padding:2px;border-radius:10px;background:rgba(0,0,0,.28);border:1px solid var(--line)}
  .sizes-row .btn,.multi .btn{flex:1 0 auto;min-width:0;height:28px;padding:0 4px;border:0;border-radius:8px;background:transparent;color:rgba(245,245,247,.66);font:600 11px var(--mono)}
  .multi{display:grid;grid-template-columns:1fr 1fr}
  .multi .btn{padding:0 10px;font:500 12.5px var(--ui);color:var(--text2)}   /* several of a few on at once, by name (a ransom note's extras) */
  :is(.sizes-row,.multi) .btn:hover:not(:disabled){background:rgba(255,255,255,.08);color:var(--text)}
  :is(.sizes-row,.multi) .btn.on,:is(.sizes-row,.multi) .btn.on:hover:not(:disabled){background:rgba(255,255,255,.9);color:var(--ink)}
  .sizes-row .btn:disabled{opacity:1;cursor:default}   /* the last one lit: it stays */
  .sizes-row .btn.here{box-shadow:inset 0 0 0 2px var(--acc)}   /* the size on the canvas */
  .sizes-row .btn.away{opacity:.5;outline:1px dashed currentColor;outline-offset:-4px}   /* clipped onto a layer not shown at that size: not shown there either */
  :is(.sizes-row,.multi) .btn:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
  .sizes-picks{display:flex;flex-wrap:wrap;gap:2px;margin-top:-2px}
  .scene-ping{position:fixed;width:20px;height:20px;margin:-10px 0 0 -10px;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 2px #000;pointer-events:none;z-index:30;animation:scene-ping .9s ease-out forwards}
  @keyframes scene-ping{from{transform:scale(1);opacity:1}to{transform:scale(3.2);opacity:0}}
  /* the ⓘ, its middle at the middle of the letters beside it, .35em over their baseline (the em the text's). In a row of
     boxes it is centred on the caption's line, whose middle (Noto Sans SC's, at any line height) is .1em higher than
     its letters' — hence top; in a line of text vertical-align puts it .1em higher than that first. So a caption
     beside it in a row must not keep a margin of its own there (.capi). A button, so Tab reaches it. */
  .info{display:inline-block;flex:none;position:relative;top:.1em;width:14px;height:14px;vertical-align:calc(.45em - 7px);padding:0;border:0;background:none;color:inherit;font:inherit;opacity:.7;cursor:help}
  .info svg{display:block;width:100%;height:100%}
  .info:hover,.info:focus-visible{opacity:1;color:var(--acc)}
  .info:focus-visible{outline:2px solid var(--acc);outline-offset:1px;border-radius:50%}
  .sub{font-size:12px;opacity:.6;margin-bottom:6px;display:flex;align-items:center;gap:4px}
  /* a scrub bar, the properties' slider (see scrub in app.js): its name and value inside a bar dragged anywhere along
     it, the value following the pointer; the tick its default; a double-click types the value in */
  .sc,.cr{display:grid;grid-template-columns:minmax(0,1fr) 28px;gap:2px;align-items:center}
  :not(.psec-b,.kcol)>.sc.bare{grid-template-columns:minmax(0,1fr)}   /* no default to go back to: no rail, but in the drawer and a look's settings, where the rail lines their controls up */
  :not(.psec-b,.kcol)>.sc.bare>.rs{display:none}
  .scrow{display:flex;align-items:center;gap:6px}   /* a scrub bar and the ⓘ that explains it */
  .scrow>.sc{flex:1;min-width:0}
  .bar{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;height:34px;padding:0 10px;border-radius:10px;background:rgba(0,0,0,.28);border:1px solid var(--line);overflow:hidden;cursor:ew-resize;user-select:none;-webkit-user-select:none;touch-action:none}
  .bar:hover{border-color:rgba(255,255,255,.28)}
  .bar .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.13);pointer-events:none}
  .bar:hover .fill{background:rgba(255,255,255,.17)}
  .bar .fill::after{content:"";position:absolute;right:0;top:8px;bottom:8px;width:2px;border-radius:1px;background:rgba(255,255,255,.92)}
  .bar .tick{position:absolute;bottom:0;width:1.5px;height:6px;margin-left:-.75px;background:rgba(255,255,255,.55);pointer-events:none}
  .bar .lb{position:relative;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:12.5px;color:rgba(245,245,247,.82);white-space:nowrap;pointer-events:none}
  .sc.lines .bar{height:auto;min-height:34px;padding-top:5px;padding-bottom:5px}.sc.lines .bar .lb{white-space:normal;line-height:1.25}   /* a long name in two lines (Surprise me's chances) */
  .bar output{position:relative;flex:none;font:600 12px var(--mono);color:var(--text);white-space:nowrap;pointer-events:none}
  .sc.chg .bar output{color:var(--acc-lite)}
  .bar input[type=range]{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;pointer-events:none}
  .bar:has(input:focus-visible),.bar.typing{border-color:color-mix(in srgb,var(--acc) 80%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 20%,transparent)}
  .bar.drag{border-color:rgba(255,255,255,.45);background:rgba(0,0,0,.34)}
  .bar.drag .fill{background:rgba(255,255,255,.22)}
  .bar.drag .fill::after{width:3px;top:5px;bottom:5px;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.18)}
  body.scrubbing,body.scrubbing *{cursor:ew-resize!important}
  .bar.typing{cursor:text;background:rgba(0,0,0,.4)}
  .bar.typing .fill{opacity:.45}
  .bar .num{position:relative;width:64px;height:24px;margin:0 -4px 0 auto;padding:0 6px;border:0;border-radius:6px;background:color-mix(in srgb,var(--acc) 26%,transparent);color:#fff;font:600 12px var(--mono);text-align:right}
  .bar .num:focus{border:0;box-shadow:none}
  .bar .unit{position:relative;font:600 12px var(--mono);color:rgba(245,245,247,.74)}
  .bar.off{cursor:not-allowed;background:rgba(0,0,0,.18);border-style:dashed}
  .bar.off .lb{color:var(--text3)}
  .bar.off .fill,.bar.off .tick{display:none}   /* no value to show while it cannot act */
  .bar .why{position:relative;flex:1;min-width:0;text-align:right;font-size:12px;color:rgba(245,245,247,.74);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* the way back to a default, in the rail: shown only where a control is off its default */
  .rs{width:28px;height:28px;border-radius:8px;border:0;background:transparent;color:rgba(245,245,247,.8);display:grid;place-items:center;padding:0;cursor:pointer}
  .rs[hidden]{display:grid;visibility:hidden}   /* its place in the rail kept */
  .rs svg{width:15px;height:15px}
  .rs:hover{background:rgba(255,255,255,.1);color:#fff}
  .rs:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
  /* a colour: the whole row opens the picker; automatic says so, a colour of one's own has the way back in the rail */
  .cb{position:relative;display:flex;align-items:center;gap:10px;min-width:0;height:34px;padding:0 10px 0 8px;border-radius:10px;background:rgba(0,0,0,.28);border:1px solid var(--line);font-size:13px;cursor:pointer}
  .cb:hover{border-color:rgba(255,255,255,.28)}
  .cb:has(input:focus-visible){border-color:color-mix(in srgb,var(--acc) 80%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 20%,transparent)}
  .cb input[type=color]{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;border:0;opacity:0;cursor:pointer}
  .cb .dot{flex:none;width:18px;height:18px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.42)}
  .cb .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cb .auto{flex:none;padding:0 8px;border-radius:999px;background:rgba(255,255,255,.1);color:rgba(245,245,247,.82);font-size:11.5px;line-height:20px}
  .cb .hex{flex:none;font:600 12px var(--mono)}
  .cr.chg .hex{color:var(--acc-lite)}
  /* on or off: a switch at the end of a row, the whole row its target */
  .swr{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:34px;padding:0 4px 0 10px;border-radius:10px;font-size:13px;cursor:pointer}
  .swr:hover{background:rgba(255,255,255,.06)}
  .swr.dis{color:var(--text3);cursor:default}
  .swr.dis:hover{background:none}
  /* a choice among many: a field showing the one chosen, opening a list of them (.pklist, see picker in app.js) */
  .pk{display:flex;align-items:center;gap:9px;width:auto;min-width:0;height:34px;padding:0 8px 0 7px;border-radius:10px;background:rgba(0,0,0,.28);border:1px solid var(--line);color:var(--text);font-size:13px;text-align:left;cursor:pointer}
  .pk:hover:not(:disabled){border-color:rgba(255,255,255,.28)}
  .pk[aria-expanded=true]{border-color:rgba(255,255,255,.45);background:rgba(0,0,0,.36)}
  .pk:focus-visible{outline:none;border-color:color-mix(in srgb,var(--acc) 80%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 20%,transparent)}
  .pk:disabled{opacity:.45;cursor:default}
  .pk .pv{flex:none;display:grid;place-items:center;min-width:24px;height:22px;padding:0 3px;border-radius:6px;background:rgba(255,255,255,.08);color:#fff;font-size:12px;font-weight:800}
  .pk .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pk .chev{flex:none;display:grid;width:16px;height:16px;color:rgba(245,245,247,.7)}
  .pk .pv svg,.pklist .gl svg{display:block;width:22px;height:14px}
  .pklist{position:fixed;z-index:70;display:flex;flex-direction:column;gap:1px;padding:5px;overflow:auto;overscroll-behavior:contain;border-radius:14px;background-color:rgba(24,24,34,.9);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 18px 44px rgba(0,0,0,.5)}
  html.solid .pklist{background-color:var(--solid2);-webkit-backdrop-filter:none;backdrop-filter:none}
  .pklist .mi{flex:none;display:flex;align-items:center;gap:10px;width:100%;min-height:32px;padding:0 10px 0 8px;border:0;border-radius:8px;background:transparent;color:rgba(245,245,247,.88);font-size:13px;text-align:left;cursor:pointer;outline:none}
  .pklist .mi:hover,.pklist .mi:focus{background:rgba(255,255,255,.1);color:#fff}
  .pklist .mi:focus-visible{box-shadow:inset 0 0 0 2px var(--acc)}
  .pklist .mi[aria-selected=true]{color:#fff;font-weight:700}
  .pklist .mi .tx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pklist .mi .ck{flex:none;display:grid;width:15px;height:15px;margin-left:auto}
  .pklist .mi .gl{flex:none;display:grid;width:24px;color:rgba(245,245,247,.85)}
  .pklist .grp{flex:none;padding:8px 10px 3px;font-size:11.5px;color:var(--text3)}
  .mine-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .mine-head .cap{margin:0}
  .mine-head .btn{padding:4px 9px;font-size:12px}
  .folder,.loose{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:8px}
  .loose{border-color:transparent}
  .folder .tiles,.loose .tiles{padding:8px}
  .folder.over,.loose.over{outline:2px dashed var(--acc);outline-offset:2px}
  .fhead{display:flex;align-items:center;gap:8px;padding:5px 8px;background:var(--panel);font-size:13px}
  .fhead.plain{background:transparent;padding-left:2px;opacity:.75}
  .fhead .caret{border:0;background:transparent;color:inherit;cursor:pointer;width:18px;padding:0;font-size:12px}
  .fhead .fname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:text}
  .fhead .rename{flex:1;font-size:13px;padding:2px 6px;min-width:0}
  .fhead .fcount{font:600 11px var(--mono);opacity:.5}
  .fhead .btn{padding:2px 8px;font-size:12px}
  .pitem{border:1.5px dashed var(--line2);border-radius:14px;padding:10px;margin-top:12px}
  .pitem .thumb{margin-top:0;cursor:pointer;position:relative}
  .pitem[style*="--link"]{border-color:var(--link)}
  .pitem.passive{margin-left:18px;border-style:dotted}
  .pitem.on{border-color:var(--acc)!important}
  .pitem .thumb .del{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;border:1px solid var(--line2);background:var(--bg);color:#fff;font-size:15px;line-height:1;padding:0;cursor:pointer;display:none}
  .pitem .thumb:hover .del{display:block}
  .pitem .thumb .del:hover{background:#c0392b;border-color:#c0392b}
  .pitem .thumb .chain{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:4px;color:var(--link)}
  .pitem .thumb .chain svg{width:14px;height:14px}
  .thumb{margin-top:10px;display:grid;gap:4px;font-size:12px;opacity:.85}
  .thumb img{width:100%;max-height:180px;object-fit:contain;background:#000;border:1px solid var(--line2);border-radius:10px}
  .cpv{width:100%;display:grid;place-items:center;background:#000;border:1px solid var(--line2);border-radius:10px;overflow:hidden;font-size:12px;opacity:.95}
  .cpv canvas{width:100%;height:100%;display:block;background:repeating-conic-gradient(#3a3a46 0 25%,#262630 0 50%) 0 0/16px 16px}
  .hint.err{color:#ff7a88;opacity:1;word-break:break-word}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chips button{border:1px solid var(--line2);background:transparent;color:var(--text);padding:7px 13px 7px 11px;border-radius:999px;cursor:pointer;font-weight:500;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
  .chips:not(.small) button::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c,#fff);flex:none}   /* a channel: its colour */
  .chips button:hover{background:rgba(255,255,255,.08)}
  .chips button.on{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.45)}
  .chips.small button.on{background:rgba(255,255,255,.9);color:var(--ink);border-color:transparent}
  .chips.small{gap:4px}.chips.small button{padding:4px 8px;font-size:12px;font-weight:500}
  .recipe summary{cursor:pointer;margin:0;list-style:none}.recipe summary::-webkit-details-marker{display:none}.recipe summary::before{content:"▸ "}.recipe[open] summary::before{content:"▾ "}.recipe[open] summary{margin-bottom:8px}   /* Surprise me's recipe for the look, folded by default */
  #marquee{position:fixed;z-index:20;pointer-events:none;border:1.5px dashed #fff;outline:1px solid rgba(7,7,12,.85);background:rgba(255,255,255,.08)}
  .about{font-size:12.5px;line-height:1.75;margin-top:10px;padding:10px 12px;border-left:2px solid var(--line2);background:rgba(255,255,255,.03);opacity:.85}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .row.row3{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .row.row3 .btn{padding-inline:4px;overflow:hidden;text-overflow:ellipsis}
  .row3{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
  .ink{display:grid;grid-template-columns:1fr 44px auto;align-items:center;gap:8px;margin-top:10px;font-size:13px}
  .ink input[type=color]{width:44px;height:32px;padding:2px;background:var(--panel);border:1px solid var(--line2);border-radius:7px;cursor:pointer}
  .ink .btn{padding:4px 9px;font-size:12px}
  .acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
  .acts .btn{padding:4px 9px;font-size:12px}

  /* asset tiles */
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .tile{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.22);cursor:pointer;padding:0;display:grid;place-items:center}
  .tile.on{border-color:var(--acc)}
  .tile .none{font-size:12px;opacity:.7}
  #modal .tiles{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
  .gpick{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.22);color:inherit;font:inherit;padding:4px 10px 4px 4px;cursor:pointer;text-align:left}
  .gpick:hover{border-color:#fff}
  .gpick>span:not(.more){flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gpick .more{font-size:12px;opacity:.6;flex:none;white-space:nowrap}
  .tile:hover{border-color:#fff}
  .tile.on{border:2px solid var(--acc)}
  .ptile{padding:0;overflow:hidden}
  .ptile img{width:100%;aspect-ratio:1;object-fit:cover;display:block;pointer-events:none}
  .ptile .kind{position:absolute;left:4px;bottom:4px;font:600 10px var(--mono);background:rgba(7,7,12,.75);padding:1px 5px}
  .tile canvas{width:100%;height:100%;display:block;pointer-events:none}
  .tile .x{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border:2px solid #fff;background:var(--ink);color:#fff;font-size:12px;line-height:1;cursor:pointer;padding:0;display:none}
  .tile:hover .x{display:block}
  .ptile .x{top:4px;right:4px}   /* the tile clips what sticks out */

  /* canvas column */
  /* each in its own row, so the line under the toolbar left empty (in Setup) keeps the canvas in the row that grows */
  /* the canvas, floating on the ground; under it the tray: the size shown, every size, and the scope */
  #center{display:grid;grid-template-rows:minmax(0,1fr) auto auto;gap:12px;min-height:0;min-width:0;position:relative}
  #stage{grid-row:1}#toolsub{grid-row:2}#tray{grid-row:3}
  /* under the canvas, what is seldom wanted, quietly: muted words underlined, brighter under the pointer */
  #toolsub{display:flex;align-items:center;justify-content:center;gap:14px;height:20px;white-space:nowrap;overflow:hidden}
  #toolsub:empty{display:none}
  #toolsub .quiet{border:0;background:none;padding:0;font-size:11.5px;color:var(--text3);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
  #toolsub .quiet:hover,#toolsub .quiet:focus-visible{color:#ededf5}
  /* the size shown: what it is called over its pixels, cut short (in full on hover) */
  #toolbar{flex:0 1 150px;min-width:96px;align-self:center;padding-right:16px;border-right:1px solid var(--line)}
  #toolbar .name{font-size:13px;display:flex;flex-direction:column;gap:4px;min-width:0}
  #toolbar .name>*{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #toolbar .name small{font:12px var(--mono);color:var(--text3)}
  #stage{min-height:0;min-width:0;display:grid;place-items:center;padding:18px;overflow:hidden;position:relative}
  /* the tray: the sizes, each a thumbnail; the scope at its end */
  #tray{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 18px;padding:12px 16px;border-radius:22px;min-width:0}   /* the scope under the sizes when there is no room beside them */
  #tray .scope{display:flex;flex-direction:column;gap:8px;align-items:flex-start;flex:none;margin-left:auto;align-self:center}   /* its label and choices centred on the line, as the size's name and pixels are */
  #tray .scope>span{font-size:12px;color:var(--text2)}
  #stage.focus #cv{outline:2px dashed var(--acc);outline-offset:4px}
  #focustag{position:absolute;top:8px;left:50%;transform:translateX(-50%);max-width:80%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--acc);color:var(--acc-ink);font:700 12px var(--ui);padding:4px 12px;border-radius:999px;pointer-events:none}
  #focustag.off{background:#555;color:#fff}
  .lhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
  /* a caption and its ⓘ (capInfo): the row keeps the space under the caption, so the two are centred on each other */
  .capi{display:flex;align-items:center;gap:6px;margin-bottom:8px}
  .capi>.cap,.lhead>.capi{margin:0}
  .focusbtn{border:1px solid var(--line2);border-radius:8px;background:rgba(255,255,255,.05);color:inherit;font:500 12px var(--ui);padding:4px 9px;cursor:pointer;opacity:.85}
  .focusbtn:hover{opacity:1}
  .focusbtn.on{background:var(--acc);border-color:transparent;color:var(--acc-ink);opacity:1}
  /* the layers in 3D: a canvas over the stage, the cover's own canvas waiting under it; a bar of controls at its foot */
  #stage #cv3d{position:absolute;inset:0;width:100%;height:100%;display:none;box-shadow:none;background:none;cursor:grab}
  #stage.v3 #cv3d{display:block}
  #stage.v3 #cv{visibility:hidden}
  #stage.v3 #focustag{display:none}
  #v3hud{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:none;align-items:center;gap:10px;max-width:calc(100% - 24px);padding:7px 8px 7px 14px;background:rgba(28,30,40,.82);border:1px solid rgba(255,255,255,.2);border-radius:14px;box-shadow:0 14px 34px rgba(0,0,0,.4);font-size:12px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s}
  #stage.v3 #v3hud{display:flex}
  #stage.v3open #v3hud{opacity:1;pointer-events:auto}
  #v3hud .v3tip{opacity:.6;overflow:hidden;text-overflow:ellipsis;min-width:0;cursor:help}
  #v3hud .v3sl{flex:none;width:200px}   /* the spread, a scrub bar */
  #v3hud .focusbtn{flex:none;display:flex;align-items:center;gap:6px}
  #v3hud>b{flex:none;font-size:13px}
  #v3hud kbd{font:10.5px var(--mono);border:1px solid currentColor;border-radius:5px;padding:0 5px;opacity:.7}
  #stage canvas{display:block;touch-action:none;border-radius:6px;box-shadow:0 0 0 1px rgba(255,255,255,.12),0 40px 90px rgba(0,0,0,.55)}
  #stage #cv3d{border-radius:0}
  #cv,#strip canvas,#deal figure canvas{background:repeating-conic-gradient(#3a3a46 0 25%,#262630 0 50%) 0 0/16px 16px}   /* a see-through ground shows as a checkerboard */
  #stage.alpha canvas{background:repeating-conic-gradient(#3a3a48 0% 25%,#24242e 0% 50%) 0 0/20px 20px}
  #strip{display:flex;gap:14px;padding:2px 2px 4px;overflow-x:auto;overflow-y:hidden;align-items:flex-end;min-width:116px;flex:1 1 0}
  #strip::-webkit-scrollbar{height:8px}
  #strip::-webkit-scrollbar-track{background:transparent}
  #strip::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:4px}
  #strip::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.3)}
  #strip figure{margin:0;cursor:pointer;flex:none;display:flex;flex-direction:column;align-items:center}
  #strip figure canvas{border-radius:6px;box-shadow:0 0 0 1px rgba(255,255,255,.18)}
  #strip figure.on canvas{box-shadow:0 0 0 2px var(--acc)}
  #strip figure.on figcaption{opacity:1;color:#fff}
  #strip canvas{display:block;height:64px;width:auto}
  #strip.alpha canvas{background:repeating-conic-gradient(#3a3a48 0% 25%,#24242e 0% 50%) 0 0/12px 12px}
  #strip figcaption{font:600 12px/18px var(--mono);opacity:.7;margin-top:6px;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
  #strip figure{padding-bottom:2px}
  #strip figcaption .own{display:none;color:var(--acc);font-size:10px;margin-left:5px;cursor:help}   /* a size drawn in a layout of its own */
  #strip figure.own figcaption .own{display:inline}
  /* (scrollbars are styled with ::-webkit-scrollbar only: the standard scrollbar-* properties would switch them back to auto-hiding overlays) */

  /* layers: the Layers sheet (renderSide) — its head (the count, 3D), the chips and FOCUS, the list, and at its foot the
     selected layer's bar; the sheet is the column's height, and the list scrolls on its own between the head and the bar */
  #panel:has(>#layerbox){flex:1 1 auto;overflow:hidden;scrollbar-gutter:auto;padding:20px 14px 14px}
  #panel>#layerbox{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:12px}
  .lyhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .lycount{display:flex;align-items:baseline;gap:8px;min-width:0}
  .lycount b{flex:none;font-size:19px;font-weight:700}
  .lycount span{font-size:12px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lytg{flex:none;height:32px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);font:500 12px var(--ui);display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
  .lytg:hover{background:rgba(255,255,255,.12)}
  .lytg.on,.lytg.on:hover{background:var(--acc);border-color:transparent;color:var(--acc-ink)}
  .lytg svg{width:15px;height:15px}
  .lytg kbd{font:500 10px/14px var(--mono);border:1px solid currentColor;border-radius:5px;padding:0 4px;opacity:.6}
  .lyfilter{display:flex;align-items:stretch;gap:8px}   /* the list's chips: all, the user's, the layout's (LAYERS_UI); FOCUS beside them */
  .lyfilter .seg{flex:1;min-width:0}
  .lyfilter .seg .btn{flex:1 1 auto;min-width:0;padding:5px 6px;font-size:12px;overflow:hidden;text-overflow:ellipsis}
  .lyfilter .lytg{height:auto}
  .lyhint{margin-top:8px;line-height:1.5}
  /* a row: the grip, a tile of what the layer shows (layerTile), its name over what it holds, its chips, eye and lock */
  /* the list: the rows scroll (as tall as they are, down to the bar at the foot at most), the Background under a line
     below them always in sight; where rows go on past an edge they fade out there (listFades in app.js) */
  .layers{flex:0 1 auto;min-height:0;display:flex;flex-direction:column}
  .lyscroll{flex:0 1 auto;min-height:0;overflow-y:auto;display:grid;align-content:start;gap:3px;padding:3px 0;margin:-3px 0}   /* (room for the drop line over the first row) */
  .lyscroll.up{-webkit-mask-image:linear-gradient(to bottom,transparent,#000 24px);mask-image:linear-gradient(to bottom,transparent,#000 24px)}
  .lyscroll.down{-webkit-mask-image:linear-gradient(to top,transparent,#000 24px);mask-image:linear-gradient(to top,transparent,#000 24px)}
  .lyscroll.up.down{-webkit-mask-image:linear-gradient(transparent,#000 24px,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(transparent,#000 24px,#000 calc(100% - 24px),transparent)}
  .lybase{flex:none;padding-top:4px}
  .lybase::before{content:"";display:block;height:1px;margin:0 6px 4px;background:var(--line)}
  .layer{display:grid;grid-template-columns:14px 36px minmax(0,1fr) auto;align-items:center;gap:9px;border:1.5px solid transparent;border-radius:12px;padding:5px 6px 5px 2px;min-height:50px;box-sizing:border-box;cursor:pointer;user-select:none}
  .layer:hover{background:rgba(255,255,255,.07)}
  .layer.on{border-color:color-mix(in srgb,var(--acc) 75%,transparent);background:color-mix(in srgb,var(--acc) 15%,transparent)}
  .layer.peek:not(.on){border-color:#9a9ab4}   /* its sheet is under the pointer in the 3D view */
  .layer.over{box-shadow:0 -3px 0 var(--acc)}
  .layer.hidden .th,.layer.hidden .nm{opacity:.45}   /* hidden: dimmed, its crossed eye kept in sight */
  .layer.dim{opacity:.35;cursor:not-allowed}   /* FOCUS is on another layer: it cannot be selected */
  .layer.away .th,.layer.away .nm,.layer.away .kind,.layer.away .badge,.layer.away .ic{opacity:.4}   /* kept to other sizes: not on the cover at this one (its line says so, its chip stays bright) */
  .layer .th,.dhead .th{width:36px;height:36px;border-radius:9px;overflow:hidden;display:grid;place-items:center;background:rgba(0,0,0,.35);box-shadow:0 0 0 1px rgba(255,255,255,.12);color:#fff;font:800 12px/1 var(--ui);white-space:nowrap}
  .layer .th.one,.dhead .th.one{font-size:16px}
  .layer .th img,.dhead .th img{width:100%;height:100%;object-fit:cover;display:block}
  .layer .th .ico,.dhead .th .ico{display:grid;place-items:center;opacity:.7}
  .layer .th .ico svg,.dhead .th .ico svg{width:18px;height:18px}
  .layer .th .ico.fill,.layer .th .ico.fill svg,.dhead .th .ico.fill,.dhead .th .ico.fill svg{width:100%;height:100%;opacity:1}
  .layer .txt{min-width:0;display:flex;flex-direction:column;gap:2px}
  .layer .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:700}
  .layer .sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px;color:var(--text3)}
  .layer .end{display:flex;align-items:center;gap:6px;min-width:0}
  .layer .badge,.layer .sizes{flex:none;font-size:10.5px;line-height:16px;padding:0 6px;border:1px solid transparent;border-radius:6px;white-space:nowrap;cursor:help}
  .layer .badge{background:rgba(255,255,255,.1);color:var(--text2)}

  /* a row's eye and lock show under the pointer and on the selected row, and always when not as they start (hidden, locked; the Background's padlock).
     Hidden, they keep their room ahead of the chips, so the chips sit at the right end and the words beside them never
     change width (and are cut short again) as the pointer passes; shown, they move to the end and the chips make way */
  .layer .ic{border:0;background:transparent;width:22px;height:24px;cursor:pointer;color:var(--text);opacity:.75;padding:0;display:grid;place-items:center;visibility:hidden;order:-1}

  /* at the sheet's foot, the selected layer and what can be done to it */

  #fpop{position:absolute;z-index:21;width:300px;max-width:calc(100% - 12px);max-height:min(60vh,460px);overflow:auto;padding:16px 14px 14px;border-radius:16px}
  /* moved by a drag on any part of it that is no control (popGrabs in app.js): a grip at its top edge, and the hand over what drags */
  #fpop{cursor:grab}

  .fxrow{position:relative}

  #fpop .fxgrid{--fl:0px;--fr:0px;grid-template-columns:repeat(var(--cols),calc((100% - 16px) / 3));grid-template-rows:repeat(2,auto);padding:2px 0;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;
    -webkit-mask-image:linear-gradient(to right,transparent,#000 var(--fl),#000 calc(100% - var(--fr)),transparent);mask-image:linear-gradient(to right,transparent,#000 var(--fl),#000 calc(100% - var(--fr)),transparent)}

  .fxarrow.r{right:-8px}
  .fxtile{display:flex;flex-direction:column;gap:3px;min-width:0;padding:4px 4px 6px;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.35);color:var(--text);font:inherit;cursor:pointer}

  #hoverbox{position:absolute;z-index:19;pointer-events:none;border:1.5px solid #5aa9ff;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.3)}

  #tip{position:fixed;z-index:60;background:var(--solid2);border:1px solid var(--line2);border-radius:12px;box-shadow:0 14px 34px rgba(0,0,0,.45);padding:10px 12px;font-size:12.5px;line-height:1.7;color:#fff;white-space:normal}

  .ledit{border-top:2px solid var(--line);margin-top:8px;padding-top:8px}.ledit .row{display:flex;flex-wrap:wrap;gap:6px;margin-right:30px}.ledit .row .btn{flex:1 1 auto}

  .ledit .lhead{display:flex;justify-content:space-between;align-items:baseline}.ledit .lhead b{font-size:18px}

  /* Surprise me's window: over the left column, the canvas left in view; the hands as they are dealt, the one kept marked */

  .scard{scroll-margin-top:60px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.04);padding:14px 18px;display:flex;align-items:center;flex-wrap:wrap;gap:12px 14px;min-width:0}

  .logo-row{display:flex;align-items:center;gap:10px;min-height:44px}

  /* an input with its name inside it, quietly, before what is typed */

  /* the channels, three cards to a row; the one on the canvas outlined in its colour */
  .chgrid{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  .chcard{position:relative;display:grid;gap:8px;padding:12px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.04);min-width:0}

  .chcard.lifted .grip{color:var(--text);background:rgba(255,255,255,.12)}
  .chhole{border-radius:16px;border:1.5px dashed var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}

  .chcard .chmenu button:disabled,.preset .chmenu button:disabled{opacity:.35;cursor:default}

  .chcard .two{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:8px}

  .chadd{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:150px;border-radius:16px;border:1.5px dashed rgba(255,255,255,.22);background:transparent;color:var(--text);cursor:pointer}
  .chadd:hover{border-color:rgba(255,255,255,.45);background:rgba(255,255,255,.04)}
  .chadd small{font-size:12px;color:var(--text3)}
  /* the sizes: a row each, its name of the user's own, ratio, platforms, pixels and the switch */
  .szlist{display:grid;gap:6px}
  .szrow{display:grid;grid-template-columns:minmax(120px,200px) 64px minmax(0,1fr) 110px auto;gap:14px;align-items:center;padding:6px 12px 6px 6px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid transparent}

  .aih .state>span{overflow:hidden;text-overflow:ellipsis}

  .aih .state.busy{color:#ffe29a;border-color:rgba(255,201,60,.4)}
  .aih .state.err{color:#ffb3a8;border-color:rgba(255,107,91,.45)}
  /* an AI service's light (aiLight in app.js): grey not set up, green ready, amber at work, red when its last request failed */
  .aidot{display:inline-block;width:7px;height:7px;border-radius:50%;flex:none;background:rgba(245,245,247,.35)}
  .aidot.ok{background:#3ddc97}

  .aib{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px;align-items:start}

  .aib .hint{margin-top:6px}

  /* Export: this channel's cover at each size, ticked or not, the format, resolution and names, then Only this size and

  #modal .dlg.xp{width:min(860px,94vw);gap:16px}

  /* the file name pattern as tags (the Export window, Settings → Sizes & export): a chip a token, the text between

  /* AI repaint (repaintWin), as the design has it: on the left the photo in a compare view — the original, and the

     what to do with the one shown; on the right what to paint it as, a list that scrolls, and Repaint at its foot */
  #modal .dlg.repw{width:min(1320px,96vw);height:min(812px,88vh);padding:24px 28px 22px;grid-template-rows:minmax(0,1fr);overflow:hidden}

  .repstage{flex:1;min-height:0;container-type:size;display:grid;place-items:center}
  .cmp{position:relative;aspect-ratio:var(--ar);width:min(100cqw,100cqh * var(--ar));border-radius:14px;overflow:hidden;background:rgba(0,0,0,.4);box-shadow:0 30px 70px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.14);user-select:none;-webkit-user-select:none}

  .olegend em{color:var(--text)}
  .ofoot{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .ofoot .hint{margin:0}
  @media(max-width:900px){.ocols{grid-template-columns:minmax(0,1fr)}}
  @media(max-width:760px){.orows.two{grid-template-columns:1fr}}
  #odds-layouts.ping{animation:lays-ping 1.4s ease-out}
  @keyframes lays-ping{from{box-shadow:0 0 0 8px color-mix(in srgb,var(--acc) 30%,transparent)}to{box-shadow:0 0 0 8px transparent}}
  /* a layout preset's editor (layoutEditor): the cover as the preset has it, beside the template and the parts */
  /* a layout preset's editor: its name, the scope and Save in the head; the parts on the left; the canvas and, under
     it, the preset at each size (a click takes it there) */
  #modal .dlg.layed{width:min(1220px,96vw);gap:16px}
  .lehead{display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap}
  .lehead .ttl{flex:1;min-width:260px;display:flex;flex-direction:column;gap:6px}
  .lehead .ttl>div:first-child{display:flex;align-items:center;gap:12px}
  .lehead h2{margin:0;white-space:nowrap}
  .lehead .ttl input{max-width:240px;font-weight:700}
  .lehead .hint{margin:0}
  .lehead .grp{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2)}
  .lehead .acts .btn{padding:8px 18px;font-size:13px}
  .ls-body{display:grid;grid-template-columns:280px minmax(0,1fr);gap:18px}
  .ls-main{display:grid;gap:12px;min-width:0}
  .ls-stage{height:min(50vh,500px);display:grid;place-items:center;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .ls-stage canvas{display:block;touch-action:none;background:repeating-conic-gradient(#3a3a46 0 25%,#262630 0 50%) 0 0/16px 16px}
  /* the parts: as tall as the canvas and the sizes under it whatever part is selected (contain:size: what is in it never
     sizes it, so the dialog keeps its size); the list, then the part selected's name and buttons, then its own settings,
     the list and the settings each scrolled in their room */
  .ls-side{display:flex;flex-direction:column;gap:14px;min-width:0;contain:size;padding:14px 6px 14px 16px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.04)}
  /* each its natural height while there is room; then the settings give way first (shrinking ten times as fast), the
     list after them; each scrolls, its thin bar always there (see .scroll): 6 px and the bar's 10 on the right */
  .ls-list{flex:0 1 auto;min-height:72px;overflow-y:scroll}
  .ls-picked{flex:none;margin-right:10px}
  .ls-opts{flex:0 10 auto;min-height:96px;overflow-y:scroll;display:grid;align-content:start;gap:14px}
  :is(.ls-list,.ls-opts)::-webkit-scrollbar{width:10px}
  :is(.ls-list,.ls-opts)::-webkit-scrollbar-track{background:transparent}
  :is(.ls-list,.ls-opts)::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border:3px solid transparent;background-clip:padding-box;border-radius:6px}
  :is(.ls-list,.ls-opts)::-webkit-scrollbar-thumb:hover{background-color:rgba(255,255,255,.3)}
  .ls-side .parts{display:grid;gap:0}
  .ls-side .parts .lpart{display:flex;align-items:center;gap:8px;min-height:34px;padding:0 2px}   /* a part: its name (a click picks it), then on or off */
  .ls-side .parts .lpart .nm{flex:1;min-width:0;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ls-side .parts .lpart.on .nm{color:var(--acc);font-weight:600}
  .ls-side .parts .some{font-size:11px;opacity:.6;cursor:help}   /* a part shown at some sizes only */
  .ls-side .parts .drop{width:20px;height:20px;flex:none;border-radius:50%;border:0;background:var(--solid2);color:var(--text2);font-size:13px;line-height:1;cursor:pointer}   /* an element of the user's own, let go */
  .ls-side .parts .drop:hover{color:#fff}
  .ls-mine{margin:8px 0 2px;padding-top:8px;border-top:1px solid var(--line);font-size:12px;color:var(--text3)}   /* the user's own elements, under the parts */
  .ls-addx{margin-top:6px;font-size:13px}
  .ls-kinds{display:grid;gap:6px;margin-top:8px;justify-items:start}.ls-kinds .cap{margin:0}
  .ls-kinds .kinds{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%}.ls-kinds .kinds .btn{min-width:0;padding:7px 6px;font-size:12.5px}   /* the kinds of element, one to add */
  .ls-side .ls-picked{flex-wrap:wrap}.ls-side .ls-picked .acts{display:flex;flex-wrap:nowrap;gap:6px;margin-left:auto}   /* the part selected's name, and its buttons beside it or under it */
  .ls-picked{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;border-top:1px solid var(--line);padding-top:12px}
  .ls-run{padding:8px 12px;font-size:13px}   /* the part selected, its words in a line or in columns */
  .ls-block{display:grid;gap:8px;font-size:13px}.ls-block .layown{margin:0}
  .ls-block .seg .btn{flex:1;min-width:0;padding:6px 4px}   /* the side the block lies on, a button a side */
  .ls-block .acts{display:flex;gap:8px}.ls-block .acts .btn{flex:1;min-width:0;padding:7px 6px;font-size:12.5px;white-space:normal}
  .ls-strip{display:grid;gap:8px}
  .ls-cap{display:flex;align-items:baseline;gap:8px}.ls-cap b{font-size:13px}.ls-cap small{font-size:12px;color:var(--text3)}
  .ls-sizes{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px}
  .ls-size{position:relative;display:inline-flex}
  .ls-thumb{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text2);font:600 11.5px var(--mono);cursor:pointer}
  .ls-thumb:hover{border-color:rgba(255,255,255,.35)}
  .ls-size.on .ls-thumb{border:1.5px solid var(--acc);color:var(--text);background:color-mix(in srgb,var(--acc) 10%,transparent)}
  .ls-size.custom .ls-thumb{border-style:dashed}
  .ls-thumb .tbox{width:84px;height:56px;display:grid;place-items:center}
  .ls-thumb canvas{max-width:84px;max-height:56px;display:block;border-radius:3px}
  .ls-size .drop{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:0;background:var(--solid2);color:var(--text2);font-size:13px;line-height:1;cursor:pointer}
  .ls-size .drop:hover{color:#fff}
  .ls-plus{height:86px;padding:0 16px;border-radius:12px;border:1.5px dashed rgba(255,255,255,.25);background:transparent;color:var(--text2);cursor:pointer}
  .ls-plus:hover{border-color:rgba(255,255,255,.5);color:#fff}
  .ls-add{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--mono);align-self:center}
  .ls-add .ls-num{width:70px;padding:5px 8px;font:600 12px var(--mono)}
  @media(max-width:900px){.ls-body{grid-template-columns:1fr}.ls-side{contain:none;height:min(60vh,520px)}}
  #modal .dlg.wide{width:min(880px,94vw)}
  .parts{display:flex;flex-wrap:wrap;gap:8px}
  .part{height:34px;display:flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:10px;background:rgba(255,255,255,.08);color:var(--text);padding:0 9px;font-size:13px;cursor:pointer;min-width:0}
  .part>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .part .eye{display:inline-grid;flex:none}
  .part:hover{background:rgba(255,255,255,.14)}
  .part.off{background:transparent;color:var(--text3);border-style:dashed}
  .fxcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
  .fxcard{text-align:left;border:1px dashed var(--line2);border-radius:12px;background:transparent;color:inherit;font:inherit;padding:10px 12px;cursor:pointer;display:block}
  .fxcard:hover{border-color:#fff}
  .fxcard.on{border-color:var(--acc);background:rgba(255,255,255,.05)}
  .fxcard b{display:block;margin-bottom:6px;font-size:14px}
  .fxcard.on b::after{content:"  ✓";color:var(--acc)}
  .fxcard ul{margin:0;padding-left:16px;font-size:12px;line-height:1.55;opacity:.75}
  /* Cover → Layout parts: the same cards, two to a row in the side column */
  .fxcards.slim{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .fxcards.slim .fxcard{padding:8px 10px}
  .fxcards.slim .fxcard b{margin-bottom:3px;font-size:13px}
  .fxcards.slim .fxcard span{display:block;font-size:11.5px;line-height:1.45;opacity:.6}
  .fxcards.slim .fxcard:not(.on){opacity:.55}
  /* the phone's own arrangement goes under body[data-layout="phone"] (see arrange() in app.js): a narrow touch screen, whatever the host */
  /* a narrow window: everything one under another, the dock a row of buttons (narrower than the desktop app's window can be: 1080) */
  @media(max-width:1000px){html,body{overflow:auto}.app{height:auto}.body,.body.nodrawer{grid-template-columns:1fr}.split{display:none}.body .scroll{overflow:visible;padding-right:18px}#right>.scroll{padding-right:14px}#stage{height:60vh}
    #dock{flex-direction:row;overflow-x:auto}#dock .help{margin:0 0 0 auto}header{height:auto;flex-wrap:wrap;padding:8px 10px 8px 16px}
    #settings .win{flex-direction:column}#setnav{width:auto;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}#setnav .grow,#setnav .who{display:none}}
</style>
</head>
<body>
<div id="ambient"><canvas id="amb" width="48" height="27"></canvas><canvas id="amb0" width="48" height="27" hidden></canvas></div>
<div class="app">
  <header id="top" class="glass"></header>
  <div class="body nodrawer" id="body">
    <nav id="dock" class="glass"></nav>
    <aside id="left" class="glass"><div class="scroll" id="panel"></div></aside>
    <section id="center">
      <div id="stage"><canvas id="cv"></canvas></div>
      <div id="toolsub"></div>
      <div id="tray" class="glass"><div id="toolbar"></div><div id="strip"></div><div class="scope" id="scope"></div></div>
    </section>
    <aside id="right" class="glass"><div class="scroll" id="side"></div></aside>
  </div>
</div>
<div id="settings" hidden><div class="win glass"><nav id="setnav"></nav><div class="setbody"><button class="x" id="setclose">✕</button><div class="scroll" id="setpanel"></div></div></div></div>
<div id="menu" class="glass" hidden></div>
<div id="toast"></div>
<div id="modal" hidden></div>
<div id="ask" hidden></div>
<input type="file" id="file" hidden>
<script type="module" src="js/app.js"></script>
</body>
</html>
