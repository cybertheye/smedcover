<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmedCover</title>
<style>
  /* Bundled open fonts (SIL OFL, see fonts/OFL-*.txt) so covers look the same on every platform. */
  @font-face{font-family:"Noto Sans SC";src:url("fonts/NotoSansSC.ttf");font-weight:100 900;font-display:block}
  @font-face{font-family:"Bebas Neue";src:url("fonts/BebasNeue-Regular.ttf");font-weight:100 900;font-display:block}
  @font-face{font-family:"JetBrains Mono";src:url("fonts/JetBrainsMono.ttf");font-weight:100 800;font-display:block}

  /* Frosted glass over the cover: the page's ground is the cover itself, small and blurred (#ambient), and every
     panel is a pane of glass over it (.glass), letting its colours through. Where the glass would slow the canvas,
     or the web view cannot blur, html.solid makes the panes plain and translucent (see glassWatch in app.js). */
  :root{color-scheme:dark;--bg:#0b0b11;--ink:#15151c;--acc:#fcee0a;--acc-ink:#15151c;
        --text:#f5f5f7;--text2:rgba(245,245,247,.68);--text3:rgba(245,245,247,.5);
        --panel:rgba(255,255,255,.05);--line:rgba(255,255,255,.12);--line2:rgba(255,255,255,.24);
        --field:rgba(10,10,16,.32);
        --glass:rgba(255,255,255,.075);--glass2:rgba(255,255,255,.14);--solid:rgba(27,27,38,.94);--solid2:rgba(44,44,58,.96);
        --glass-line:rgba(255,255,255,.16);--glass-hi:inset 0 1px 0 rgba(255,255,255,.2);--glass-drop:0 24px 60px rgba(0,0,0,.38);
        --blur:blur(30px) saturate(170%);
        --ui:"Noto Sans SC",-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--ui);font-size:14px;overflow:hidden}
  button,input,select,textarea{font:inherit;color:inherit}
  #ambient{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  #ambient canvas{position:absolute;left:-10%;top:-10%;width:120%;height:120%;filter:blur(64px) saturate(150%) brightness(.62)}
  #ambient::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 45%,rgba(10,10,18,.12),rgba(8,8,14,.66))}
  .glass{background-color:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-line);box-shadow:var(--glass-hi),var(--glass-drop)}
  html.solid .glass{background-color:var(--solid);-webkit-backdrop-filter:none;backdrop-filter:none}
  .app{position:relative;z-index:1;display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr);height:100vh;padding:12px;gap:12px}

  /* top bar: the profile and channel, undo and redo, then Surprise me, Export and the ⋯ menu */
  header{display:flex;align-items:center;gap:12px;height:56px;padding:0 10px 0 18px;border-radius:18px}
  header h1{font:400 26px "Bebas Neue",sans-serif;letter-spacing:.08em;margin:0 2px 0 0}
  header .sep{width:1px;height:24px;background:var(--line2)}
  /* the window's close, minimise and zoom buttons sit at the top bar's left end (ownTitleBar in app.js): on a Mac its own
     float over it; on Windows and Linux the page draws them (#winbtns), at the same place and size and in a Mac's colours */
  html.ownbar header{padding-left:96px}
  @media(max-width:1200px){html.ownbar header .grp>span{display:none}}   /* "Saved as you go" gives the buttons' room back */
  #winbar{position:fixed;left:0;right:0;top:0;height:22px;z-index:45;display:none}
  body:has(#settings:not([hidden])) #winbar,body:has(#modal:not([hidden])) #winbar,body:has(#deal:not([hidden])) #winbar{display:block}
  #winbtns{position:fixed;left:30px;top:32px;z-index:46;display:flex;gap:6px}
  html:not(.ownbar) #winbtns{display:none}   /* full screen */
  #winbtns button{width:14px;height:16px;padding:0;border:0;background:none;display:grid;place-items:center}
  #winbtns span{width:12px;height:12px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2)}
  #winbtns .close span{background:#ff5f57;color:#4d0000}
  #winbtns .min span{background:#febc2e;color:#995700}
  #winbtns .zoom span{background:#28c840;color:#006500}
  #winbtns svg{opacity:0}
  #winbtns:hover svg{opacity:1}   /* their signs while the pointer is over any of them */
  #winbtns button:active span{filter:brightness(.78)}
  #winbtns.idle:not(:hover) span{background:rgba(235,235,245,.22)}   /* grey while another window is the one in use */
  .crumb{display:flex;align-items:center;gap:4px;min-width:0}
  .crumb>span{color:var(--text3)}
  .crumb select{width:auto;max-width:190px;min-width:0;border:0;background:transparent;padding:6px 8px;border-radius:10px;cursor:pointer}
  .crumb select:hover{background:rgba(255,255,255,.08)}
  .crumb .dot{width:9px;height:9px;border-radius:50%;background:var(--acc);flex:none}
  .grp{display:flex;align-items:center;gap:6px}
  .grp>span{font-size:12px;color:var(--text3);white-space:nowrap}
  .spacer{flex:1}
  .ibtn{width:40px;height:40px;display:grid;place-items:center;border:0;border-radius:12px;background:transparent;color:var(--text);cursor:pointer;padding:0}
  .ibtn:hover:not(:disabled){background:rgba(255,255,255,.1)}
  .ibtn:disabled{opacity:.35;cursor:default}
  .ibtn.on{background:rgba(255,255,255,.18)}
  .btn{border:1px solid var(--line2);background:rgba(255,255,255,.06);padding:7px 12px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
  .btn:hover:not(:disabled){background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.36)}
  .btn:disabled{opacity:.3;cursor:default}
  .btn.on{background:rgba(255,255,255,.9);color:var(--ink);border-color:transparent}
  .btn.solid{background:var(--acc);color:var(--acc-ink);border-color:transparent;font-weight:700}
  .btn.solid:hover:not(:disabled){background:var(--acc);filter:brightness(1.08)}
  .btn.wide{width:100%;padding:11px}
  .btn.cta{height:40px;padding:0 18px;font-size:14px;display:inline-flex;align-items:center;gap:8px;border-radius:12px}
  .btn.cta svg{flex:none}
  .btn.cta.glassy{background:var(--glass2);border:1px solid rgba(255,255,255,.24);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}
  .btn.cta.glassy:hover:not(:disabled){background:rgba(255,255,255,.2)}
  .btn.cta kbd{font:500 11px var(--mono);color:rgba(255,255,255,.65);border:1px solid rgba(255,255,255,.28);border-radius:6px;padding:1px 5px}   /* the key that does it too */
  .seg{display:flex;padding:3px;gap:2px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid var(--line)}
  .seg .btn{border:0;background:transparent;border-radius:9px;color:var(--text2)}
  .seg .btn:hover:not(:disabled){background:rgba(255,255,255,.08);color:var(--text)}
  .seg .btn.on,.seg .btn.on:hover:not(:disabled){background:rgba(255,255,255,.9);color:var(--ink);font-weight:700}
  .seg.big .btn{padding:8px 20px;font-size:15px}
  header select{background:var(--field);border:1px solid var(--line);padding:6px 8px;max-width:180px}

  /* a sheet's foot: what is seldom wanted, last */
  .sheet-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;align-items:flex-start;gap:12px}
  .linkbtn{border:0;background:none;color:#ffd166;font-size:13px;padding:0;cursor:pointer;text-align:left}
  .linkbtn:where(:hover:not(:disabled)){color:#ffe29a;text-decoration:underline;text-underline-offset:3px}   /* :where — the properties' own links keep their colour */
  .linkbtn:disabled{opacity:.35;cursor:default}
  .togrow{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:14px;background:rgba(0,0,0,.2);border:1px solid var(--line)}
  .tog{width:40px;height:24px;border-radius:12px;background:rgba(255,255,255,.18);position:relative;border:0;cursor:pointer;padding:0;flex:none}
  .tog::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:9px;background:#fff;transition:left .15s}
  .tog.on{background:#3ddc97}
  .tog.on::after{left:19px}
  .tog:disabled{opacity:.4;cursor:default}
  /* Layout → the layout presets, each a card */
  .presets{display:grid;gap:8px}
  .preset{display:grid;gap:8px;padding:10px;border-radius:14px;background:rgba(0,0,0,.2);border:1px solid var(--line)}
  .preset input{padding:7px 10px;font-weight:700}
  .preset:hover{border-color:var(--line2)}
  .preset.previewing{border-color:rgba(255,255,255,.5)}
  .preset-h{display:flex;align-items:center;gap:8px}
  .preset-h input{flex:1;min-width:0}
  .preset-h .pv{display:none;flex:none;font-size:12px;color:var(--text2);white-space:nowrap}
  .preset.previewing .pv{display:inline}   /* the canvas shows the cover laid out by it (see hoverPreset) */
  .preset .acts{justify-content:flex-start}
  /* Assets → ways to add, four to a row; then shelves, each with its name, how many, and "All" */
  .quicks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
  .quick{height:68px;border-radius:14px;border:1px solid var(--line2);background:rgba(255,255,255,.07);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;cursor:pointer;padding:0}
  .quick:hover{background:rgba(255,255,255,.13)}
  .quick.on{border-color:color-mix(in srgb,var(--acc) 70%,transparent);background:color-mix(in srgb,var(--acc) 14%,transparent)}
  .quick .sw-chip{width:18px;height:18px;border-radius:5px;box-shadow:0 0 0 1px rgba(255,255,255,.3)}
  /* the search over every shelf: a field with its magnifier, and ✕ while it holds words */
  .asearch{display:flex;align-items:center;gap:8px;height:38px;padding:0 5px 0 12px;border-radius:12px;background:var(--field);border:1px solid var(--line2);color:var(--text3)}
  .asearch:focus-within{border-color:color-mix(in srgb,var(--acc) 70%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 14%,transparent)}
  .asearch input[type=text]{flex:1;min-width:0;height:100%;padding:0;border:0;border-radius:0;background:transparent;font-size:13px;box-shadow:none}
  .asearch input::placeholder{color:var(--text3)}
  .asearch .clr{flex:none;width:28px;height:28px;border:0;border-radius:8px;background:transparent;color:var(--text2);font-size:12px;cursor:pointer;padding:0}
  .asearch .clr:hover{background:rgba(255,255,255,.12);color:#fff}
  .shelf{display:grid;gap:10px}
  .shelf-h{display:flex;align-items:baseline;gap:12px}
  .shelf-h .cap .n{color:var(--text3)}
  .shelf-h .info{align-self:center}   /* the row is lined up by baselines, which a drawn ⓘ has none of */
  .shelf-h .linkbtn:first-of-type{margin-left:auto}
  .shelf-groups{display:grid;gap:12px}
  .tiles.shapes{grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
  /* the colour block's edges: grey shapes on a lighter ground, the one in use in the accent (not the channel's colour on each) */
  .shp{height:38px;min-width:0;border-radius:9px;border:1px solid var(--line);background:rgba(0,0,0,.22);padding:4px;color:var(--text3);display:flex;cursor:pointer}
  .shp svg{width:100%;height:100%;border-radius:5px;background:rgba(255,255,255,.1)}
  .shp:hover{border-color:#fff;color:var(--text2)}
  .shp.on{border:2px solid var(--acc);color:var(--acc);padding:3px}

  /* Look → every look as a card, the cover drawn in it; the cards scroll on their own so the look's settings stay near */
  .lookgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:max-content;gap:10px;max-height:min(48vh,440px);overflow-y:auto;padding:2px 4px 2px 2px;margin:0 -4px 0 -2px;scrollbar-gutter:stable}
  .lookgrid::-webkit-scrollbar{width:8px}.lookgrid::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:4px}
  .lookcard{position:relative;display:flex;flex-direction:column;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:rgba(0,0,0,.25);color:var(--text);cursor:pointer;text-align:left}
  .lookcard:hover{border-color:rgba(255,255,255,.5)}
  .lookcard.on{border:2px solid var(--acc)}
  .lookcard .lookpic{flex:none;display:block;width:100%;aspect-ratio:16/9;height:auto;object-fit:contain;background:rgba(0,0,0,.35)}   /* contain: a tall cover shown whole */
  .lookcard .nm{padding:7px 9px 8px;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lookcard .badge{position:absolute;left:6px;top:6px;padding:1px 8px;border-radius:999px;background:var(--acc);color:var(--acc-ink);font-size:11px;font-weight:700}
  .lookgrid .lookcard[hidden]{display:none}
  .lookgrid.finding .lookcard.on{order:-1}   /* the profile's own look first while the search or a chip sorts the cards */
  .lookgrid-none{margin:0}
  /* above the cards: the search and a chip for each kind of look */
  .lookfind{display:flex;flex-direction:column;gap:10px}
  .lookfind-q{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:12px;border:1px solid var(--line2);background:rgba(10,10,16,.3);color:var(--text3);cursor:text}
  .lookfind-q:focus-within{border-color:color-mix(in srgb,var(--acc) 70%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 14%,transparent)}
  .lookfind-q input[type=text]{flex:1;min-width:0;height:100%;padding:0;border:0;border-radius:0;background:transparent;color:var(--text);font-size:13px;box-shadow:none}
  .lookchips{gap:6px}
  /* under the cards, Tune this look: its heading opens and shuts the look's description, a chevron at its end as on the drawer's groups */
  .tunehead{display:flex;align-items:center;gap:6px;margin-bottom:6px}
  .tunehead b{min-width:0}
  .tunehead.folds{cursor:pointer;user-select:none}
  .tunehead .fold{flex:none;margin-left:auto;width:26px;height:26px;padding:0;border:0;border-radius:8px;background:transparent;color:var(--text2);display:grid;place-items:center;cursor:pointer}
  .tunehead.folds:hover .fold{background:rgba(255,255,255,.08);color:var(--text)}
  .tunehead .chev{width:7px;height:7px;margin:0 5px 0 0;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
  .tunehead .fold[aria-expanded=true] .chev{transform:rotate(45deg);margin:0 0 5px}
  #pvtag{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);z-index:4;padding:6px 14px;border-radius:999px;background:rgba(28,30,40,.82);border:1px solid rgba(255,255,255,.22);font-size:12.5px;white-space:nowrap;pointer-events:none}
  #pvtag[hidden],#stage.v3 #pvtag{display:none}

  /* the ⋯ menu, under its button */
  #menu{position:fixed;z-index:42;width:320px;max-height:calc(100vh - 80px);overflow-y:auto;padding:8px;border-radius:18px;display:flex;flex-direction:column;gap:2px;background-color:rgba(28,30,40,.62)}
  html.solid #menu{background-color:var(--solid2)}
  #menu[hidden]{display:none}
  #menu .mg{font-size:11px;color:var(--text3);letter-spacing:.06em;padding:8px 12px 4px}
  #menu .mi{display:flex;align-items:center;gap:12px;min-height:40px;padding:6px 10px 6px 12px;border-radius:11px;border:0;background:transparent;color:var(--text);text-align:left;width:100%;cursor:pointer}
  #menu .mi:hover{background:rgba(255,255,255,.12)}
  #menu .mi .mt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  #menu .mi .mt small{font-size:11.5px;color:var(--text3);line-height:1.4}
  #menu .mi .sc{font-size:12px;color:var(--text3)}
  #menu .mi kbd.sc{flex:none;font:500 12.5px -apple-system,"Segoe UI",var(--ui);letter-spacing:.04em}
  #menu .mi .light{display:flex;align-items:center;gap:6px;min-width:0}
  #menu .mi .light>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #menu .mi.danger{color:#ff9a8a}
  #menu .mi .chev{flex:none;width:7px;height:7px;margin-right:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);opacity:.5}
  #menu .mi .chev.open{transform:rotate(45deg)}
  #menu .mi.sub{padding-left:24px;min-height:36px}
  #menu .foot{font-size:11.5px;line-height:1.55;color:var(--text3);padding:8px 12px 6px}
  #menu .sep{height:1px;background:var(--line);margin:4px 8px}
  #menu .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0;padding:6px 8px 4px 12px;font-size:13px;color:var(--text2)}

  /* body: the dock | the open sheet | the canvas | the selected layer's properties. Each scrolls on its own;
     the canvas always stays in view. */
  .body{display:grid;grid-template-columns:76px var(--lw,340px) minmax(0,1fr) var(--rw,320px);gap:12px;min-height:0}
  /* the side columns are as wide as their edge is dragged (see columns() in app.js) */
  aside{position:relative}
  .split{position:absolute;top:18px;bottom:18px;width:9px;cursor:col-resize;z-index:5;touch-action:none;border-radius:5px}
  #left .split{right:-11px}
  #right .split{left:-11px}
  .split:hover,.split.on{background:linear-gradient(90deg,transparent 3px,var(--acc) 3px,var(--acc) 5px,transparent 5px)}
  aside{display:flex;flex-direction:column;min-height:0;border-radius:22px}
  #left>.scroll,#right>.scroll{border-radius:22px}
  #right>.scroll{padding:18px 14px 40px}
  #right .box{border:0;background:none;padding:0;border-radius:0}   /* the column is the box: the selected layer's properties fill it */
  /* the drawer of the selected layer's properties: shut, the canvas takes its column */
  .body.nodrawer{grid-template-columns:76px var(--lw,340px) minmax(0,1fr)}
  .body.nodrawer #right{display:none}
  /* a narrow window with the drawer open: the drawer takes the sheet's place, the dock's buttons bringing the sheet back */
  .body.tight{grid-template-columns:76px minmax(0,1fr) var(--rw,320px)}
  .body.tight #left{display:none}
  #right .dhead{display:flex;align-items:center;gap:8px;margin:0 0 10px}
  #right .dhead>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  #right .dhead small{font-size:11.5px;color:var(--text3)}
  #right .dhead b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #right .dhead .x{flex:none;width:30px;height:30px;border-radius:10px;border:0;background:rgba(255,255,255,.08);color:var(--text);font-size:13px;cursor:pointer}
  #right .dhead .x:hover{background:rgba(255,255,255,.16)}
  #right .dfoot{display:flex;gap:16px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
  /* the dock: one button per sheet, the canvas's help at its foot */
  #dock{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border-radius:22px;min-height:0}
  #dock button{width:64px;height:64px;border:0;border-radius:16px;background:transparent;color:var(--text2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;cursor:pointer;padding:0}
  #dock button:hover{background:rgba(255,255,255,.08);color:var(--text)}
  #dock button.on{background:rgba(255,255,255,.18);color:#fff;font-weight:500;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
  #dock .help{width:44px;height:44px;margin-top:auto;color:var(--text3)}
  .sheet-h{display:flex;flex-direction:column;gap:4px;margin-bottom:2px}
  .sheet-h b{font-size:19px;font-weight:700}
  .scroll{overflow-y:auto;min-height:0;padding:20px 18px 40px;display:flex;flex-direction:column;gap:16px;scrollbar-gutter:stable}
  .scroll>*{flex:none}
  .scroll::-webkit-scrollbar{width:10px}
  /* where a scrollbar takes room (Windows, Linux, a Mac set to show them always: html.bars, set in start() in app.js), every one is a thin one on the glass, as the sheets' */
  :where(html.bars) ::-webkit-scrollbar{width:10px;height:10px}
  :where(html.bars) ::-webkit-scrollbar-track,:where(html.bars) ::-webkit-scrollbar-corner{background:transparent}
  :where(html.bars) ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border:3px solid transparent;background-clip:padding-box;border-radius:6px}
  :where(html.bars) ::-webkit-scrollbar-thumb:hover{background-color:rgba(255,255,255,.3)}
  /* a pane's scrollbar is not cut to the pane's rounded corners (WebKit draws it over them, as Chromium does), so its
     track stops short of them, a little less than the corner's radius from either end: the bar stays inside the pane */
  :where(html.bars) #menu::-webkit-scrollbar-track{margin:14px 0}
  :where(html.bars) #fpop::-webkit-scrollbar-track{margin:12px 0}
  :where(html.bars) :is(#letterwin,#cropwin,#weavewin,#brushwin)::-webkit-scrollbar-track{margin:16px 0}
  :where(html.bars) #modal .dlg::-webkit-scrollbar-track{margin:20px 0}
  .scroll::-webkit-scrollbar-track{background:transparent;margin:18px 0}
  .scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border:3px solid transparent;background-clip:padding-box;border-radius:6px}
  .scroll::-webkit-scrollbar-thumb:hover{background-color:rgba(255,255,255,.3)}

  label.cap,.cap{display:block;font-size:12px;color:var(--text2);letter-spacing:.04em;margin-bottom:8px}
  input[type=text],input[type=password],input[type=number],textarea,select{width:100%;background:var(--field);border:1px solid var(--line);padding:9px 12px;border-radius:12px}
  select{cursor:pointer}
  option{background:#22222e;color:var(--text)}   /* a dropdown's list, where the system draws it (WebView2) */
  input[type=text]:disabled{opacity:.35}
  textarea{height:100px;resize:vertical;font-size:16px;line-height:1.6}
  input:focus,textarea:focus,select:focus{outline:none;border-color:color-mix(in srgb,var(--acc) 70%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 14%,transparent)}
  .hint{font-size:12px;color:var(--text3);line-height:1.7;margin-top:6px}
  .box{border:1px solid var(--line);background:rgba(0,0,0,.16);border-radius:16px;padding:14px}
  .hint.ok{color:#3ddc84;opacity:1}
  .hint.err{opacity:1}
  .seg.wide{margin-bottom:4px}.seg.wide .btn{flex:1}
  /* a pane switch (Assets): | Vector assets | Bitmaps | as a control the panel's width — each pane a segment between
     upright bars; the chosen one white, raised a little, its bars in the channel colour; the other dim */
  .subtabs{display:flex;gap:2px;padding:3px;margin:2px 0 8px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid var(--line)}
  .subtabs button{flex:1;border:0;border-radius:9px;background:none;color:var(--text2);font-family:inherit;font-weight:500;font-size:14px;padding:8px 0;cursor:pointer}
  .subtabs button:hover{background:rgba(255,255,255,.08);color:var(--text)}
  .subtabs button.on{background:rgba(255,255,255,.9);color:var(--ink);font-weight:700}
  .peek{margin-top:8px;font-size:12px}.peek summary{cursor:pointer;opacity:.7}
  .peek pre{white-space:pre-wrap;max-height:220px;overflow:auto;margin:6px 0 0;padding:8px;border:1px solid var(--line2);font:12px/1.6 ui-monospace,monospace;opacity:.85}
  /* The selected layer's properties, in the drawer: its groups one under another, each a line with its name, what it is
     set to (while it is shut) and a chevron; open, its controls under it on a grid of three columns — a control's own
     label, the control, its value — so a group's sliders, values and checkboxes line up. The body takes no box of its
     own (display:contents): its children are the group's grid items. A slider's three parts take a column each;
     anything else spans the three. A popover of the bar over the canvas lays out a group's controls the same way. */
  .props{display:flex;flex-direction:column}
  .psec{display:grid;grid-template-columns:max-content minmax(0,1fr) max-content;column-gap:10px;row-gap:12px;align-items:center;padding:11px 2px;border-top:1px solid var(--line)}
  .props>.psec:first-child{border-top:0;padding-top:2px}
  .psec-b{display:contents}
  .psec:not(.open)>.psec-b{display:none}
  .psec-h{grid-column:1/-1;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;cursor:pointer;user-select:none;min-width:0}
  .psec-h .sum{flex:1;min-width:0;text-align:right;font-size:12px;font-weight:400;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .psec.open>.psec-h .sum{visibility:hidden}
  .psec-h .chev{flex:none;width:7px;height:7px;margin:0 4px 3px 2px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);opacity:.45;transition:transform .15s}
  .psec.open>.psec-h .chev{transform:rotate(45deg);margin-bottom:5px}
  .psec-h:hover .chev{opacity:.9}
  .psec-b>*{grid-column:1/-1;min-width:0;margin:0!important}
  .psec-b>.sl{display:contents}
  .psec-b>.sl>:nth-child(1){grid-column:1;white-space:nowrap;font-size:13px}
  .psec-b>.sl>:nth-child(2){grid-column:2;width:100%;margin:0}
  .psec-b>.sl>:nth-child(3){grid-column:3;font:600 12px var(--mono);text-align:right;opacity:.8;min-width:3.6em}
  .psec-b>.sl.off>:nth-child(2){grid-column:2/-1;font-size:12px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}   /* one line, as tall as a slider's row: the whole reason is in the tip */
  .psec-b>.sl.off>*{opacity:.5}
  .psec-b>.chk{display:flex}
  .psep{height:8px}
  .psec-b>.fxh{font-size:12px;font-weight:600;opacity:.75}
  .psec-b>.fxs{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px}
  .psec-b>.fxs>span{opacity:.7}
  .psec-b>.fxs>span.fxt{font-weight:600;opacity:.75}
  .fxs .linkbtn,.artback .linkbtn{border:0;background:none;color:var(--acc);font-size:12px;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
  .artback{margin:4px 0 0 92px}   /* under the figure's graphic, past the label column */
  .layscope .seg .btn{flex:1;padding-left:6px;padding-right:6px}   /* the Style tab's template box: the scope it changes, the toolbar's own */
  .layown{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;margin:0 0 10px;padding:6px 8px;border:1px dashed var(--acc)}
  .sizes-ctl{margin:10px 0 4px}   /* the sizes a layer shows at, in its properties */
  .sizes-ctl .cap{display:flex;align-items:center;gap:6px}
  .sizes-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
  .sizes-row .btn{padding:4px 8px;font:600 11px var(--mono);opacity:.55}
  .sizes-row .btn.on{opacity:1}
  .sizes-row .btn.here{box-shadow:inset 0 -2px 0 var(--acc)}   /* the size on the canvas */
  .sizes-row .btn.away{border-style:dashed;opacity:.5}   /* clipped onto a layer not shown at that size: not shown there either */
  .sizes-picks{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px}
  .sizes-picks .linkbtn.on{text-decoration:none;opacity:.5;cursor:default}
  .layown .linkbtn,.sizes-picks .linkbtn{border:0;background:none;color:var(--acc);font-size:12px;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px;white-space:nowrap}
  .fxs .linkbtn:disabled{opacity:.35;cursor:default;text-decoration:none}
  .fxs>.fxa{display:flex;gap:12px}
  .psec-b>.fxs>span.jump{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
  .psec-b>.fxs>span.jump:hover{opacity:1}
  .scene-ping{position:fixed;width:20px;height:20px;margin:-10px 0 0 -10px;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 2px #000;pointer-events:none;z-index:30;animation:scene-ping .9s ease-out forwards}
  @keyframes scene-ping{from{transform:scale(1);opacity:1}to{transform:scale(3.2);opacity:0}}
  /* the ⓘ, its middle at the middle of the letters beside it, .35em over their baseline (the em the text's). In a row of
     boxes it is centred on the caption's line, whose middle (Noto Sans SC's, at any line height) is .1em higher than
     its letters' — hence top; in a line of text vertical-align puts it .1em higher than that first. So a caption
     beside it in a row must not keep a margin of its own there (.capi). */
  .info{display:inline-block;flex:none;position:relative;top:.1em;width:14px;height:14px;vertical-align:calc(.45em - 7px);opacity:.7;cursor:help}
  .info svg{display:block;width:100%;height:100%}
  .info:hover{opacity:1;color:var(--acc)}
  .sub{font-size:12px;opacity:.6;margin-bottom:6px;display:flex;align-items:center;gap:4px}
  /* a colour: a row of its own, as a checkbox is — the swatch, its name, then "automatic" or a way back to it */
  .sw{display:flex;align-items:center;gap:10px;min-height:22px}
  .sw input[type=color]{width:30px;height:22px;padding:1px;background:var(--panel);border:1px solid var(--line2);border-radius:7px;cursor:pointer;flex:none}
  .sw .auto{font-size:12px;opacity:.45}
  .sw .linkbtn{border:0;background:none;color:var(--acc);font-size:12px;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
  .mine-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .mine-head .cap{margin:0}
  .mine-head .btn{padding:4px 9px;font-size:12px}
  .folder,.loose{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:8px}
  .loose{border-color:transparent}
  .folder .tiles,.loose .tiles{padding:8px}
  .folder.over,.loose.over{outline:2px dashed var(--acc);outline-offset:2px}
  .fhead{display:flex;align-items:center;gap:8px;padding:5px 8px;background:var(--panel);font-size:13px}
  .fhead.plain{background:transparent;padding-left:2px;opacity:.75}
  .fhead .caret{border:0;background:transparent;color:inherit;cursor:pointer;width:18px;padding:0;font-size:12px}
  .fhead .fname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:text}
  .fhead .rename{flex:1;font-size:13px;padding:2px 6px;min-width:0}
  .fhead .fcount{font:600 11px var(--mono);opacity:.5}
  .fhead .btn{padding:2px 8px;font-size:12px}
  .pitem{border:1.5px dashed var(--line2);border-radius:14px;padding:10px;margin-top:12px}
  .pitem .thumb{margin-top:0;cursor:pointer;position:relative}
  .pitem[style*="--link"]{border-color:var(--link)}
  .pitem.passive{margin-left:18px;border-style:dotted}
  .pitem.on{border-color:var(--acc)!important}
  .pitem .thumb .del{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;border:1px solid var(--line2);background:var(--bg);color:#fff;font-size:15px;line-height:1;padding:0;cursor:pointer;display:none}
  .pitem .thumb:hover .del{display:block}
  .pitem .thumb .del:hover{background:#c0392b;border-color:#c0392b}
  .pitem .thumb .chain{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:4px;color:var(--link)}
  .pitem .thumb .chain svg{width:14px;height:14px}
  .thumb{margin-top:10px;display:grid;gap:4px;font-size:12px;opacity:.85}
  .thumb img{width:100%;max-height:180px;object-fit:contain;background:#000;border:1px solid var(--line2);border-radius:10px}
  .cpv{width:100%;display:grid;place-items:center;background:#000;border:1px solid var(--line2);border-radius:10px;overflow:hidden;font-size:12px;opacity:.95}
  .cpv canvas{width:100%;height:100%;display:block;background:repeating-conic-gradient(#3a3a46 0 25%,#262630 0 50%) 0 0/16px 16px}
  .hint.err{color:#ff7a88;opacity:1;word-break:break-word}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chips button{border:1px solid var(--line2);background:transparent;color:var(--text);padding:7px 13px 7px 11px;border-radius:999px;cursor:pointer;font-weight:500;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
  .chips:not(.small) button::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c,#fff);flex:none}   /* a channel: its colour */
  .chips button:hover{background:rgba(255,255,255,.08)}
  .chips button.on{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.45)}
  .chips.small button.on{background:rgba(255,255,255,.9);color:var(--ink);border-color:transparent}
  .chips.small{gap:4px}.chips.small button{padding:4px 8px;font-size:12px;font-weight:500}
  .recipe summary{cursor:pointer;margin:0;list-style:none}.recipe summary::-webkit-details-marker{display:none}.recipe summary::before{content:"▸ "}.recipe[open] summary::before{content:"▾ "}.recipe[open] summary{margin-bottom:8px}   /* Surprise me's recipe for the look, folded by default */
  .sl{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;gap:8px;margin-top:10px;font-size:13px}
  .sl input{accent-color:var(--acc);width:100%}
  .sl.off{opacity:.5}
  #marquee{position:fixed;z-index:20;pointer-events:none;border:1.5px dashed #fff;outline:1px solid rgba(7,7,12,.85);background:rgba(255,255,255,.08)}
  .about{font-size:12.5px;line-height:1.75;margin-top:10px;padding:10px 12px;border-left:2px solid var(--line2);background:rgba(255,255,255,.03);opacity:.85}
  .sl .why{font-size:12px;line-height:1.4}
  .sl output{font:600 12px var(--mono);text-align:right;opacity:.8}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .row.row3{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .row.row3 .btn{padding-inline:4px;overflow:hidden;text-overflow:ellipsis}
  .row3{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
  .ink{display:grid;grid-template-columns:1fr 44px auto;align-items:center;gap:8px;margin-top:10px;font-size:13px}
  .ink input[type=color]{width:44px;height:32px;padding:2px;background:var(--panel);border:1px solid var(--line2);border-radius:7px;cursor:pointer}
  .ink .btn{padding:4px 9px;font-size:12px}
  .chk{display:flex;align-items:center;gap:10px;cursor:pointer;margin:8px 0}
  .chk input{width:17px;height:17px;accent-color:var(--acc);flex:none}
  .acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
  .acts .btn{padding:4px 9px;font-size:12px}

  /* asset tiles */
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .tile{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.22);cursor:pointer;padding:0;display:grid;place-items:center}
  .tile.on{border-color:var(--acc)}
  .tile .none{font-size:12px;opacity:.7}
  #modal .tiles{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
  .gpick{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.22);color:inherit;font:inherit;padding:4px 10px 4px 4px;cursor:pointer;text-align:left}
  .gpick:hover{border-color:#fff}
  .gpick>span:not(.more){flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gpick .more{font-size:12px;opacity:.6;flex:none;white-space:nowrap}
  .tile:hover{border-color:#fff}
  .tile.on{border:2px solid var(--acc)}
  .ptile{padding:0;overflow:hidden}
  .ptile img{width:100%;aspect-ratio:1;object-fit:cover;display:block;pointer-events:none}
  .ptile .kind{position:absolute;left:4px;bottom:4px;font:600 10px var(--mono);background:rgba(7,7,12,.75);padding:1px 5px}
  .tile canvas{width:100%;height:100%;display:block;pointer-events:none}
  .tile .x{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border:2px solid #fff;background:var(--ink);color:#fff;font-size:12px;line-height:1;cursor:pointer;padding:0;display:none}
  .tile:hover .x{display:block}
  .ptile .x{top:4px;right:4px}   /* the tile clips what sticks out */

  /* canvas column */
  /* each in its own row, so the line under the toolbar left empty (in Setup) keeps the canvas in the row that grows */
  /* the canvas, floating on the ground; under it the tray: the size shown, every size, and the scope */
  #center{display:grid;grid-template-rows:minmax(0,1fr) auto auto;gap:12px;min-height:0;min-width:0;position:relative}
  #stage{grid-row:1}#toolsub{grid-row:2}#tray{grid-row:3}
  /* under the canvas, what is seldom wanted, quietly: muted words underlined, brighter under the pointer */
  #toolsub{display:flex;align-items:center;justify-content:center;gap:14px;height:20px;white-space:nowrap;overflow:hidden}
  #toolsub:empty{display:none}
  #toolsub .quiet{border:0;background:none;padding:0;font-size:11.5px;color:var(--text3);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
  #toolsub .quiet:hover,#toolsub .quiet:focus-visible{color:#ededf5}
  /* the size shown: what it is called over its pixels, cut short (in full on hover) */
  #toolbar{flex:0 1 150px;min-width:96px;align-self:center;padding-right:16px;border-right:1px solid var(--line)}
  #toolbar .name{font-size:13px;display:flex;flex-direction:column;gap:4px;min-width:0}
  #toolbar .name>*{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #toolbar .name small{font:12px var(--mono);color:var(--text3)}
  #stage{min-height:0;min-width:0;display:grid;place-items:center;padding:18px;overflow:hidden;position:relative}
  /* the tray: the sizes, each a thumbnail; the scope at its end */
  #tray{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 18px;padding:12px 16px;border-radius:22px;min-width:0}   /* the scope under the sizes when there is no room beside them */
  #tray .scope{display:flex;flex-direction:column;gap:8px;align-items:flex-start;flex:none;margin-left:auto}
  #tray .scope>span{font-size:12px;color:var(--text2)}
  #stage.focus #cv{outline:2px dashed var(--acc);outline-offset:4px}
  #focustag{position:absolute;top:8px;left:50%;transform:translateX(-50%);max-width:80%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--acc);color:var(--acc-ink);font:700 12px var(--ui);padding:4px 12px;border-radius:999px;pointer-events:none}
  #focustag.off{background:#555;color:#fff}
  .lhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
  /* a caption and its ⓘ (capInfo): the row keeps the space under the caption, so the two are centred on each other */
  .capi{display:flex;align-items:center;gap:6px;margin-bottom:8px}
  .capi>.cap,.lhead>.capi{margin:0}
  .lbtns{display:flex;gap:6px}
  .lfilter{margin:8px 0}   /* the list's chips: all, the user's, the layout's (LAYERS_UI) */
  .lfilter .seg .btn{flex:1;min-width:0;padding:5px 8px;font-size:12px;overflow:hidden;text-overflow:ellipsis}
  .lfilter .hint{margin-top:6px;line-height:1.5}
  .focusbtn{border:1px solid var(--line2);border-radius:8px;background:rgba(255,255,255,.05);color:inherit;font:500 12px var(--ui);padding:4px 9px;cursor:pointer;opacity:.85}
  .focusbtn:hover{opacity:1}
  .focusbtn.on{background:var(--acc);border-color:transparent;color:var(--acc-ink);opacity:1}
  .focusbtn.v3btn{display:inline-flex;align-items:center;gap:4px}
  .focusbtn.v3btn svg{width:12px;height:12px}
  /* the layers in 3D: a canvas over the stage, the cover's own canvas waiting under it; a bar of controls at its foot */
  #stage #cv3d{position:absolute;inset:0;width:100%;height:100%;display:none;box-shadow:none;background:none;cursor:grab}
  #stage.v3 #cv3d{display:block}
  #stage.v3 #cv{visibility:hidden}
  #stage.v3 #focustag{display:none}
  #v3hud{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:none;align-items:center;gap:10px;max-width:calc(100% - 24px);padding:7px 8px 7px 14px;background:rgba(28,30,40,.82);border:1px solid rgba(255,255,255,.2);border-radius:14px;box-shadow:0 14px 34px rgba(0,0,0,.4);font-size:12px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s}
  #stage.v3 #v3hud{display:flex}
  #stage.v3open #v3hud{opacity:1;pointer-events:auto}
  #v3hud .v3tip{opacity:.6;overflow:hidden;text-overflow:ellipsis;min-width:0;cursor:help}
  #v3hud .v3sl{display:flex;align-items:center;gap:6px;flex:none;opacity:.85}
  #v3hud .v3sl input{width:90px;accent-color:var(--acc)}
  #v3hud .focusbtn{flex:none;display:flex;align-items:center;gap:6px}
  #v3hud>b{flex:none;font-size:13px}
  #v3hud kbd{font:10.5px var(--mono);border:1px solid currentColor;border-radius:5px;padding:0 5px;opacity:.7}
  #stage canvas{display:block;touch-action:none;border-radius:6px;box-shadow:0 0 0 1px rgba(255,255,255,.12),0 40px 90px rgba(0,0,0,.55)}
  #stage #cv3d{border-radius:0}
  #cv,#strip canvas,#deal figure canvas{background:repeating-conic-gradient(#3a3a46 0 25%,#262630 0 50%) 0 0/16px 16px}   /* a see-through ground shows as a checkerboard */
  #stage.alpha canvas{background:repeating-conic-gradient(#3a3a48 0% 25%,#24242e 0% 50%) 0 0/20px 20px}
  #strip{display:flex;gap:14px;padding:2px 2px 4px;overflow-x:auto;overflow-y:hidden;align-items:flex-end;min-width:116px;flex:1 1 0}
  #strip::-webkit-scrollbar{height:8px}
  #strip::-webkit-scrollbar-track{background:transparent}
  #strip::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:4px}
  #strip::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.3)}
  #strip figure{margin:0;cursor:pointer;flex:none;display:flex;flex-direction:column;align-items:center}
  #strip figure canvas{border-radius:6px;box-shadow:0 0 0 1px rgba(255,255,255,.18)}
  #strip figure.on canvas{box-shadow:0 0 0 2px var(--acc)}
  #strip figure.on figcaption{opacity:1;color:#fff}
  #strip canvas{display:block;height:64px;width:auto}
  #strip.alpha canvas{background:repeating-conic-gradient(#3a3a48 0% 25%,#24242e 0% 50%) 0 0/12px 12px}
  #strip figcaption{font:600 12px/18px var(--mono);opacity:.7;margin-top:6px;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
  #strip figure{padding-bottom:2px}
  #strip figcaption .own{display:none;color:var(--acc);font-size:10px;margin-left:5px;cursor:help}   /* a size drawn in a layout of its own */
  #strip figure.own figcaption .own{display:inline}
  /* (scrollbars are styled with ::-webkit-scrollbar only: the standard scrollbar-* properties would switch them back to auto-hiding overlays) */

  /* layers */
  .layers{display:grid;gap:3px}
  .layer{display:grid;grid-template-columns:18px minmax(0,1fr) auto 24px 24px;align-items:center;gap:6px;border:1px solid transparent;border-radius:11px;background:rgba(255,255,255,.04);padding:4px 4px 4px 8px;min-height:34px;cursor:pointer;user-select:none}
  .layer:hover{background:rgba(255,255,255,.08)}
  .layer.on{border-color:color-mix(in srgb,var(--acc) 75%,transparent);background:color-mix(in srgb,var(--acc) 14%,transparent)}
  .layer.peek:not(.on){border-color:#9a9ab4}   /* its sheet is under the pointer in the 3D view */

  .layer.away>.ic,.layer.away>.nm,.layer.away .kind,.layer.away>.what{opacity:.3}   /* kept to other sizes: not on the cover at this one */
  .layer .sizes{font:600 10px var(--mono);letter-spacing:.02em;white-space:nowrap;padding:1px 5px;border:1px solid currentColor;opacity:.7;cursor:help}
  .layer.away .sizes{opacity:1;color:var(--acc)}
  /* a row's eye and lock show under the pointer and on the selected row, and always when not as they start (hidden, locked) */
  .layer .ic{border:0;background:transparent;width:24px;height:24px;cursor:pointer;color:var(--text);opacity:.75;padding:0;display:grid;place-items:center;visibility:hidden}
  .layer:hover .ic,.layer.on .ic,.layer .ic.keep{visibility:visible}

  .layer .ic.pin{opacity:.45;cursor:help}
  .layer .what{display:grid;place-items:center;opacity:.6}
  .layer .nm .words{margin-left:7px;color:var(--text3);font-size:12px}

  .layer .only{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-left:7px;vertical-align:1px}

  .layer.clip{margin-left:16px}
  /* under the list, the selected layer and what can be done to it */
  .selbar{display:flex;align-items:center;gap:2px;margin-top:10px;padding:5px 5px 5px 12px;border-radius:14px;background:rgba(255,255,255,.06)}
  .selbar>span{flex:1;min-width:0;font-size:12.5px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .selbar>span b{color:var(--text);font-weight:600}
  .ib{flex:none;width:30px;height:30px;border:0;border-radius:9px;background:transparent;color:var(--text);display:grid;place-items:center;cursor:pointer;padding:0}
  .ib:hover:not(:disabled){background:rgba(255,255,255,.12)}
  .ib:disabled{opacity:.3;cursor:default}
  .ib.on{background:rgba(255,255,255,.18)}
  /* over the canvas: the selected layer's bar of its most used settings, a popover of one of them, and the frame of
     the layer under the pointer in the list */
  #ftb{position:absolute;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:4px;border-radius:14px;white-space:nowrap;max-width:calc(100% - 12px)}
  #ftb[hidden],#fpop[hidden],#hoverbox[hidden]{display:none}

  html.solid #ftb,html.solid #fpop{background-color:var(--solid)}

  #ftb button>span{overflow:hidden;text-overflow:ellipsis}

  #ftb button.more{background:rgba(255,255,255,.14)}   /* More…, a segment of its own */

  #ftb button:disabled{opacity:.35;cursor:default}
  #ftb .sep{width:1px;height:18px;background:var(--line);margin:0 3px}
  #ftb .chip{flex:none;width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 1px rgba(255,255,255,.45)}
  #ftb button.dotbtn{width:36px;padding:0;justify-content:center}   /* a lettering's colours, a round button of their own */
  #ftb .dot{flex:none;width:18px;height:18px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.5)}
  #ftb button.open .dot{box-shadow:0 0 0 2px rgba(21,21,28,.35)}
  #ftb .ico{flex:none}
  #ftb .aa{font-weight:700;opacity:.8}
  #fpop{position:absolute;z-index:21;width:300px;max-width:calc(100% - 12px);max-height:min(60vh,460px);overflow:auto;padding:12px 14px 14px;border-radius:16px}
  #fpop .fpop-h{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:10px}
  #fpop .psec{border:0;padding:0}
  #fpop.wide{width:600px}
  /* the text effects as cards (the Effect group, in the drawer and in its popover): the layer's first letter drawn in each */
  .fxdeck{display:flex;flex-direction:column;gap:8px}
  .fxdeck .fxhint{font-size:12px;color:var(--text3)}
  .fxgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .fxtile.folded,.fxarrow{display:none}
  /* in the popover all in one row, six in sight and an edge of the next, the rest scrolled to (fxRow); at an end with
     more beyond it, the cards fade out under an arrow */
  .fxrow{position:relative}
  #fpop .fxtile.folded{display:flex}
  #fpop .fxdeck .seeall{display:none}
  #fpop .fxgrid{--fl:0px;--fr:0px;grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:calc((100% - 48px) / 6.3);padding:2px 0;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;
    -webkit-mask-image:linear-gradient(to right,transparent,#000 var(--fl),#000 calc(100% - var(--fr)),transparent);mask-image:linear-gradient(to right,transparent,#000 var(--fl),#000 calc(100% - var(--fr)),transparent)}
  #fpop .fxgrid::-webkit-scrollbar{display:none}

  .fxarrow{position:absolute;top:calc(50% - 14px);width:28px;height:28px;padding:0;place-items:center;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:rgba(24,24,34,.88);color:var(--text);cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.4)}
  .fxarrow:hover{background:rgba(64,64,78,.95)}
  .fxarrow.l{left:-8px}
  .fxarrow.r{right:-8px}
  .fxtile{display:flex;flex-direction:column;gap:3px;min-width:0;padding:4px 4px 6px;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.35);color:var(--text);font:inherit;cursor:pointer}
  .fxtile:hover{border-color:rgba(255,255,255,.5)}
  .fxtile.on{border:2px solid var(--acc);padding:3px 3px 5px}
  .fxtile canvas{display:block;width:100%;height:auto;aspect-ratio:2/1;border-radius:8px}
  .fxtile.light canvas{background:#ece8df}   /* a dark letter on a light ground */
  .fxtile span{font-size:11px;line-height:1.3;text-align:center;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
  .fxtile span i{display:inline-block;font-style:normal}
  #hoverbox{position:absolute;z-index:19;pointer-events:none;border:1.5px solid #5aa9ff;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
  /* with the Layout sheet open, each layout part framed over the stage and named (placeFrames); a press goes through to the canvas */
  #partframes{position:absolute;z-index:18;pointer-events:none;overflow:hidden}
  #partframes[hidden]{display:none}
  #partframes .pframe{position:absolute;box-sizing:border-box;border:1.5px dashed rgba(255,255,255,.8);border-radius:4px;background:rgba(255,255,255,.05);box-shadow:0 0 0 1px rgba(7,7,12,.3),inset 0 0 0 1px rgba(7,7,12,.3)}   /* edged in dark, to read on a light ground too */
  #partframes .ptag{position:absolute;height:20px;padding:0 7px;border-radius:6px;background:rgba(20,20,28,.78);color:#fff;font-size:11px;line-height:20px;white-space:nowrap}
  .layer.clip .nm::before{content:"↓ ";color:var(--acc)}

  #tip{position:fixed;z-index:60;background:var(--solid2);border:1px solid var(--line2);border-radius:12px;box-shadow:0 14px 34px rgba(0,0,0,.45);padding:10px 12px;font-size:12.5px;line-height:1.7;color:#fff;white-space:normal}
  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:rgba(250,250,252,.94);color:var(--ink);padding:12px 22px;border-radius:999px;font-weight:600;box-shadow:0 14px 40px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:80vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #toast.on{opacity:1}
  #toast.on.act{pointer-events:auto}   /* a word with a way on: its button can be clicked while it shows */
  #toast button{margin-left:16px;border:0;background:none;color:var(--ink);font:inherit;font-weight:700;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  body.drop::after{content:attr(data-drop);position:fixed;inset:12px;border:3px dashed var(--acc);border-radius:24px;background:rgba(10,10,18,.82);display:grid;place-items:center;font-size:28px;letter-spacing:.2em;z-index:45;pointer-events:none}
  /* the ransom note's letters, one by one: the strip (each letter as drawn) and the picked letter's controls */
  .letters{display:grid;gap:6px;margin:4px 0 8px}
  .lrow{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
  .lrow .lgap{width:8px}.lrow .lmark{opacity:.5;font-size:15px}
  .lt{position:relative;min-width:26px;height:30px;padding:0 4px;border:2px solid transparent;background:none;color:#fff;font:700 17px var(--ui);line-height:1;cursor:pointer}
  .lt.k-tile{background:var(--p);color:var(--i)}
  .lt.k-cut{color:var(--p);-webkit-text-stroke:1px #07070c;paint-order:stroke fill}
  .lt.k-deep{color:var(--p);text-shadow:1px 1px 0 #555,2px 2px 0 #333}
  .lt.k-photo{background:linear-gradient(135deg,#e0a46a,#5d86b0);-webkit-background-clip:text;background-clip:text;color:transparent}
  .lt.hero{font-size:21px}
  .lt.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
  .lt.edited::after,.lt.locked::after{content:"";position:absolute;top:-4px;right:-4px;width:7px;height:7px;border-radius:50%;background:var(--acc)}
  .lt.locked::after{border-radius:0;background:#fff}
  .ledit{border-top:2px solid var(--line);margin-top:8px;padding-top:8px}.ledit .row{display:flex;flex-wrap:wrap;gap:6px}.ledit .row .btn{flex:1 1 auto}.ledit .sl{grid-template-columns:72px 1fr 52px}
  .ledit .lhead{display:flex;justify-content:space-between;align-items:baseline}.ledit .lhead b{font-size:18px}
  .lgrid{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px 10px;align-items:center;margin:10px 0}
  .lcol{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
  .lsw{width:22px;height:22px;border:1px solid var(--line2);border-radius:6px;padding:0;cursor:pointer}
  .lsw.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}.lsw.auto{background:var(--panel);color:#fff;font-size:12px}
  .lcol input[type=color]{width:30px;height:22px;padding:1px;background:var(--panel);border:1px solid var(--line2);border-radius:7px;cursor:pointer}
  /* Surprise me's window: over the left column, the canvas left in view; the hands as they are dealt, the one kept marked */
  #letterwin,#cropwin,#weavewin,#brushwin{position:fixed;z-index:35;background-color:rgba(28,30,40,.72);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid rgba(255,255,255,.22);border-radius:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 30px 70px rgba(0,0,0,.55);padding:16px;display:grid;gap:10px;overflow:auto}
  html.solid #letterwin,html.solid #cropwin,html.solid #weavewin,html.solid #brushwin{background-color:var(--solid2);-webkit-backdrop-filter:none;backdrop-filter:none}
  #letterwin[hidden],#cropwin[hidden],#weavewin[hidden],#brushwin[hidden]{display:none}

  #letterwin .head b,#cropwin .head b,#weavewin .head b,#brushwin .head b{font-size:15px}
  #letterwin .x,#cropwin .x,#weavewin .x,#brushwin .x{width:30px;height:30px;flex:none;border:0;border-radius:10px;background:rgba(255,255,255,.08);color:#fff;font-size:13px;line-height:1;cursor:pointer;padding:0}
  #letterwin .x:hover,#cropwin .x:hover,#weavewin .x:hover,#brushwin .x:hover{background:rgba(255,255,255,.16)}
  #letterwin .hint,#cropwin .hint,#weavewin .hint,#brushwin .hint{margin:0}
  /* the weave window: each letter of the lettering a cut-out weaves with, in front of it (lit) or behind it (faint, dashed) */
  #weave-box{display:grid;gap:14px}
  .wlayer{display:grid;gap:6px}.wlayer .whead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .wl{min-width:26px;height:30px;padding:0 4px;border:2px dashed var(--line2);background:none;color:#fff;font:700 17px var(--ui);line-height:1;cursor:pointer;opacity:.5}
  .wl.on{border:2px solid var(--acc);background:var(--acc);color:var(--ink);opacity:1}
  .wkey{display:flex;gap:12px;align-items:center;font-size:12px;opacity:.85}.wkey .wl{height:22px;min-width:22px;font-size:12px;cursor:default}
  .weave-with{display:grid;gap:2px;margin-top:6px}

  #brushring[hidden]{display:none}#brushring.behind{border-style:dashed}
  #crop-stage{background:repeating-conic-gradient(#2a2a33 0 25%,#1d1d24 0 50%) 0 0/16px 16px}
  /* Surprise me's window: over the whole window, the cover dimmed and blurred behind it; the hands as large as fit
     (see dealFit), under them a bar of glass with the parts to leave alone, the chances, Deal again and Done */
  #deal{position:fixed;inset:0;z-index:36;display:flex;flex-direction:column;align-items:center;gap:22px;padding:28px 48px;overflow:auto}
  #deal[hidden]{display:none}

  html.solid #deal .deal-dim{background:rgba(8,8,12,.92);-webkit-backdrop-filter:none;backdrop-filter:none}

  #deal kbd{font:11px var(--mono);border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:1px 6px}

  #deal figure canvas{display:block;width:100%;height:auto}

  #deal figcaption b{font-size:14px;color:var(--text)}
  #deal figcaption>*{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #deal .deal-bar{margin-top:auto;width:min(1200px,100%);box-sizing:border-box;border-radius:24px;display:flex;align-items:center;flex-wrap:wrap;gap:14px 18px;padding:14px 18px 14px 24px}
  #deal .deal-bar .grow{flex:1}

  #deal .lock:disabled{opacity:.7;border-style:dashed;cursor:default}   /* the layout, locked with the places */
  #deal .again,#deal .done{height:48px;border-radius:14px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
  #deal .again{padding:0 20px}#deal .done{padding:0 28px}

  body.dealing .app{pointer-events:none}   /* nothing else to be done to the cover while hands are dealt onto it */
  body.dealing #deal figure,body.dealing #deal .deal-dim,body.dealing #deal .deal-undo,body.dealing #deal .deal-bar button{pointer-events:none}
  body.dealing #deal .deal-undo,body.dealing #deal .deal-bar button{opacity:.5}
  @keyframes dealIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}

  #modal{position:fixed;inset:0;background:rgba(5,5,10,.55);display:grid;place-items:center;z-index:40}
